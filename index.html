<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="호미의 보드게임">
<meta name="theme-color" content="#FDEAC4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>호미의 보드게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FDEAC4; --paper-deep:#F6D9A2; --card:#FFF4DC;
  --wood:#B9773A; --wood-dark:#7A4A22; --wood-light:#D9A35F;
  --ink:#3B2414; --ink-soft:#7A5A40; --gold:#E2A93B; --berry:#B2453A; --leaf:#4E7F3A;
  --line:rgba(122,74,34,.22); --shade:rgba(74,44,20,.18);
  --p1:#C8433A; --p2:#3A6EA5; --p3:#4E8A3E; --p4:#D99A1E; --p5:#7B4F9D;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --name:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#2A1F17; --paper-deep:#36281D; --card:#3B2C20;
    --wood:#A86A33; --wood-dark:#E1B57A; --wood-light:#7A4E28;
    --ink:#F7E6C6; --ink-soft:#CDB08C; --line:rgba(247,230,198,.18); --shade:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#2A1F17; --paper-deep:#36281D; --card:#3B2C20;
  --wood:#A86A33; --wood-dark:#E1B57A; --wood-light:#7A4E28;
  --ink:#F7E6C6; --ink-soft:#CDB08C; --line:rgba(247,230,198,.18); --shade:rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{word-break:keep-all;height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}
.app{height:100%;max-width:1100px;margin:0 auto;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:12px 18px 14px}
.screen.on{display:flex;animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.art{background:#FDEAC4;-webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 62%,transparent 100%)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.2}

/* wood */
.plank{position:relative;color:#FFF6E4;border-radius:14px;
  background:
   repeating-linear-gradient(176deg,rgba(255,255,255,.06) 0 2px,transparent 2px 9px),
   repeating-linear-gradient(183deg,rgba(60,30,10,.10) 0 1px,transparent 1px 17px),
   linear-gradient(180deg,#C88447,#A8672F);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(70,35,10,.35),0 4px 0 #6E4019,0 8px 14px var(--shade)}
.plank:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(70,35,10,.35),0 1px 0 #6E4019,0 3px 8px var(--shade)}
.ghost{border:2px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink-soft);background:transparent}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:44px;flex:none}
.bar h2{font-size:22px;flex:1;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-soft)}
.iconbtn svg{width:24px;height:24px}

/* splash */
#splash{padding:0;background:#FDEAC4;align-items:center;justify-content:center;overflow:hidden}
#splash .scene{position:relative;width:min(100%,520px);height:100%;max-height:900px}
#splash .scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%}
#splash.play .scene img{animation:plop 1.1s cubic-bezier(.3,1.6,.5,1) both .35s}
@keyframes plop{0%{transform:translateY(-40px) scale(1.12);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.meeple{position:absolute;width:34px;height:34px;left:50%;top:58%;opacity:0}
#splash.play .meeple{animation:scatter 1s cubic-bezier(.2,.8,.3,1) forwards .85s}
@keyframes scatter{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r))}}
#splash .title{position:absolute;left:50%;top:11%;transform:translateX(-50%);width:min(86%,420px);text-align:center;opacity:0;padding:16px 10px 18px;border-radius:18px}
#splash .title b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,10.5vw,54px);line-height:1.05;white-space:nowrap;color:#FFF6E4;text-shadow:0 3px 0 #6E4019,0 6px 14px rgba(60,30,10,.35);letter-spacing:.5px}
#splash .title small{display:block;margin-top:6px;font-size:15px;color:#FCE7C2;opacity:.95}
#splash .title::before,#splash .title::after{content:"";position:absolute;top:-34px;width:3px;height:36px;background:#6E4019;border-radius:2px}
#splash .title::before{left:22%}#splash .title::after{right:22%}
#splash.play .title{animation:swing .9s cubic-bezier(.3,1.5,.5,1) forwards 1.25s}
@keyframes swing{0%{opacity:0;transform:translateX(-50%) translateY(-60px) rotate(-6deg)}60%{opacity:1;transform:translateX(-50%) translateY(6px) rotate(2deg)}100%{opacity:1;transform:translateX(-50%) rotate(0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* home */
#home{gap:14px}
.home-head{display:flex;align-items:center;gap:8px;flex:none}
.home-head h1{font-size:30px;flex:1}
.resume{flex:none;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:2px dashed var(--wood-light)}
.resume[hidden]{display:none}
.resume p{margin:0;flex:1;font-size:15px}
.resume b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.resume .plank{padding:9px 14px;font-family:var(--display);font-size:17px}
.big{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:26px;background:var(--card);
  box-shadow:0 6px 0 var(--paper-deep),0 10px 24px var(--shade);padding:10px 16px 18px;text-align:center;position:relative}
.big img{width:min(78%,360px);aspect-ratio:1;object-fit:cover;flex:0 1 auto;min-height:0}
.big h2{font-size:34px;margin-top:2px}
.big p{margin:2px 0 0;color:var(--ink-soft);font-size:15px}
.minis{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--paper-deep);padding:8px 6px 10px;text-align:center;position:relative}
.mini img{width:100%;aspect-ratio:1;object-fit:cover}
.mini span{font-family:var(--display);font-size:16px;display:block;margin-top:2px}
.mini em{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;background:var(--paper-deep);color:var(--ink-soft);border-radius:8px;padding:1px 7px}
.mini.soon{opacity:.6}
@media (orientation:landscape) and (min-width:700px){
  #home{display:none;grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto 1fr;column-gap:18px}
  #home.on{display:grid}
  .home-head,.resume{grid-column:1/-1}
  .big{grid-column:1;grid-row:3}
  .minis{grid-column:2;grid-row:3;grid-template-columns:1fr;align-content:stretch}
  .mini{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 14px}
  .mini img{width:96px}
  .mini span{font-size:20px}
}

/* select game */
.board-pick{position:relative;width:min(100%,440px,52svh);aspect-ratio:1;margin:0 auto;flex:none;container-type:inline-size}
.board-pick img{width:100%;height:100%;object-fit:contain}
.board-label{position:absolute;left:23%;right:19%;top:42%;height:27%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;
  text-align:center;color:#FFF3DA;font-family:var(--display);text-shadow:0 .5cqw 0 rgba(60,30,10,.55);pointer-events:none;transform:rotate(-4deg)}
.board-label b{font-weight:400;font-size:clamp(24px,11cqw,52px);line-height:1.1}
.board-label small{font-family:var(--body);font-size:clamp(13px,4.6cqw,20px);opacity:.92}
.board-pick select{position:absolute;left:20%;right:15%;top:38%;height:34%;opacity:0;font-size:16px}
.picklist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.gamebtn{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--card);border:2px solid transparent;text-align:left}
.gamebtn.sel{border-color:var(--wood)}
.gamebtn b{font-family:var(--display);font-weight:400;font-size:19px}
.gamebtn small{color:var(--ink-soft);font-size:14px}
.cta{flex:none;margin-top:10px;padding:15px;font-family:var(--display);font-size:21px;width:100%}
.cta[disabled]{filter:grayscale(.7);opacity:.55;pointer-events:none}

/* players */
.hint{flex:none;margin:4px 0 10px;color:var(--ink-soft);font-size:15px;text-align:center}
.plist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px}
.pl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid transparent}
.pl.sel{border-color:var(--wood)}
.pl .dot{width:30px;height:30px;flex:none}
.pl b{flex:1;font-weight:700;font-family:var(--name);font-size:19px}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--wood-light);display:grid;place-items:center;flex:none}
.pl.sel .check{background:var(--wood);border-color:var(--wood)}
.pl.sel .check::after{content:"";width:10px;height:16px;border:solid #FFF6E4;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.pl .edit{color:var(--ink-soft);font-size:14px;padding:6px 8px}
.addp{display:flex;gap:8px;flex:none;margin-top:10px}
.addp input{flex:1;min-width:0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;font:inherit}
.addp button{padding:0 16px}

/* score */
#score{gap:8px}
.itemnav{flex:none;display:flex;align-items:center;gap:8px}
.itemnav .arrow{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none}
.itemnav .arrow svg{width:26px;height:26px}
.itemsel{position:relative;flex:1;height:54px;min-width:0}
.itemsel .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-family:var(--display);font-size:22px;pointer-events:none}
.itemsel .face small{font-family:var(--body);font-size:13px;opacity:.8}
.itemsel select{position:absolute;inset:0;opacity:0;font-size:16px;width:100%}
.itemdesc{flex:none;margin:2px 2px 2px;padding:10px 14px;border-radius:14px;background:var(--card);border:2px dashed var(--wood-light);font-size:15px;line-height:1.45}
.itemdesc b{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--ink);margin-bottom:2px}
.itemdesc span{display:block;color:var(--ink-soft)}
.itemdesc i{display:block;font-style:normal;color:var(--wood-dark);margin-top:4px;font-size:14px}
.rows{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--card)}
.row .who{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.row .who svg{width:26px;height:26px;flex:none}
.row .who b{font-family:var(--name);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .calc{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:46px;height:46px;border-radius:13px;background:var(--paper-deep);font-size:26px;font-family:var(--display);line-height:1}
.step button:active{transform:scale(.94)}
.step input{width:62px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);text-align:center;font:inherit;font-family:var(--display);font-size:24px;-webkit-user-select:text;user-select:text}
.choices{display:flex;gap:6px;flex:none}
.choices button{min-width:46px;height:46px;border-radius:13px;background:var(--paper-deep);font-family:var(--display);font-size:20px;padding:0 8px}
.choices button.on{background:var(--wood);color:#FFF6E4}
.totals{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.tot{flex:1 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--paper-deep);font-size:14px;white-space:nowrap}
.tot svg{width:18px;height:18px}
.tot .n{font-family:var(--name);font-weight:700}
.tot b{font-family:var(--display);font-weight:400;font-size:19px}
.tot.lead{outline:2px solid var(--gold)}
.scoreactions{flex:none;display:flex;gap:8px}
.scoreactions .cta{margin-top:0}
.scoreactions .instant{flex:none;width:auto;padding:0 14px;font-size:16px;border-radius:14px;background:var(--card);border:2px solid var(--berry);color:var(--berry);font-family:var(--display)}

/* tally */
#tally{align-items:center;justify-content:center;text-align:center;gap:6px}
#tally img{width:min(82%,380px);aspect-ratio:1;object-fit:cover}
#tally h2{font-size:28px}
.dots span{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:var(--wood);animation:bob 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}

/* award */
#award{align-items:center;gap:4px}
#award .crown{width:min(46%,220px);aspect-ratio:1;object-fit:cover;flex:none}
#award h2{font-size:26px;text-align:center;flex:none}
#award .sub{color:var(--ink-soft);font-size:15px;margin:0;flex:none;text-align:center;min-height:22px}
.podium{flex:1;min-height:0;width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;padding-top:8px}
.spot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;opacity:0;transform:translateY(24px) scale(.9);transition:all .5s cubic-bezier(.3,1.5,.5,1)}
.spot.show{opacity:1;transform:none}
.spot .nm{font-family:var(--name);font-weight:800;font-size:18px;text-align:center;line-height:1.15;margin-bottom:2px;word-break:keep-all}
.spot .pt{font-size:14px;color:var(--ink-soft);margin-bottom:6px}
.spot svg.m{width:38px;height:38px;margin-bottom:4px}
.block{width:100%;border-radius:12px 12px 4px 4px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--display);font-size:30px}
.s1 .block{height:44%;min-height:96px}.s2 .block{height:32%;min-height:72px}.s3 .block{height:22%;min-height:52px}
.s1{order:2}.s2{order:1}.s3{order:3}
.s1 .nm{font-size:22px}
.rest{flex:none;display:flex;gap:14px;justify-content:center;color:var(--ink-soft);font-size:15px;min-height:22px;opacity:0;transition:opacity .4s}
.rest.show{opacity:1}
.awardactions{flex:none;display:flex;gap:10px;width:100%;max-width:520px}
.awardactions .cta{margin-top:6px}
.awardactions .ghost{margin-top:6px;flex:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* modal */
.modal{position:absolute;inset:0;background:rgba(40,24,12,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.modal.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--paper);border-radius:22px;padding:18px 16px 16px;box-shadow:0 -6px 30px rgba(0,0,0,.25);animation:enter .25s ease-out}
.sheet h3{font-size:22px;text-align:center}
.sheet p{color:var(--ink-soft);text-align:center;margin:4px 0 12px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{padding:13px;border-radius:14px;background:var(--card);font-family:var(--name);font-weight:700;font-size:17px;border:2px solid transparent}
.opts button.on{border-color:var(--wood)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:12px;border-radius:14px;background:var(--card);font-family:var(--display);font-size:18px;border:2px solid transparent}
.seg button.on{border-color:var(--berry);color:var(--berry)}
.sheet .row2{display:flex;gap:8px;margin-top:12px}
.sheet .row2 .cta{margin-top:0}
.sheet .row2 .ghost{flex:none}
.row2 .cta,.scoreactions .cta,.awardactions .cta{flex:1;width:auto;min-width:0}
.toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
/* shared chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;flex:none}
.chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--card);border:2px solid transparent;font-family:var(--name);font-weight:700;font-size:15px}
.chip svg{width:20px;height:20px}
.chip.on{border-color:var(--wood);background:var(--paper-deep)}
.toggle{display:flex;align-items:center;justify-content:center;gap:8px;flex:none;color:var(--ink-soft);font-size:14px;margin-top:6px}
.toggle input{width:20px;height:20px;accent-color:var(--wood)}

/* first player */
#first{gap:8px}
#first .hero{width:min(54%,260px,30svh);aspect-ratio:1;object-fit:cover;margin:0 auto;flex:none;transition:transform .3s}
#first .hero.pounce{animation:pounce .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pounce{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-18px) scale(1.06)}100%{transform:none}}
.ring{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:center;padding:4px;touch-action:pan-y}
.ring.n1,.ring.n3{grid-template-columns:repeat(1,1fr)}
.ring.n3{grid-template-columns:repeat(3,1fr)}
.ring.n5{grid-template-columns:repeat(6,1fr)}
.ring.n5 .slot{grid-column:span 2}.ring.n5 .slot:nth-child(4){grid-column:2/span 2}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 6px;border-radius:20px;background:var(--card);border:3px solid transparent;transition:transform .12s,background .12s;min-height:92px}
.slot svg{width:36px;height:36px}
.slot b{font-family:var(--name);font-weight:800;font-size:18px;text-align:center;line-height:1.2}
.slot.hot{background:var(--gold);border-color:var(--wood-dark);transform:scale(1.05)}
.slot.hot b{color:#3B2414}
.slot.win{background:var(--gold);border-color:var(--wood-dark);animation:winpop .7s cubic-bezier(.3,1.6,.5,1) both}
.slot.lose{opacity:.35}
@keyframes winpop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1.1)}}
.verdict{flex:none;text-align:center;font-family:var(--display);font-size:28px;min-height:38px}
.empty{flex:1;display:grid;place-items:center;color:var(--ink-soft);text-align:center;padding:0 20px}

/* wheel */
#wheel{gap:8px}
.counts{display:flex;gap:8px;justify-content:center;flex:none;align-items:center}
.counts span{color:var(--ink-soft);font-size:15px;margin-right:2px}
.counts button{width:46px;height:46px;border-radius:14px;background:var(--card);font-family:var(--display);font-size:20px;border:2px solid transparent}
.counts button.on{background:var(--wood);color:#FFF6E4}
.wheelbox{position:relative;flex:1;min-height:0;display:grid;place-items:center;touch-action:none}
.wheelwrap{position:relative;width:min(92vw,58svh,520px);aspect-ratio:1}
#wheelSvg{width:100%;height:100%;filter:drop-shadow(0 8px 14px var(--shade))}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:34px;height:42px;z-index:2}
.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;border:4px solid #7A4A22;background:#FDEAC4;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.hub img{width:100%;height:100%;object-fit:cover}
.result{flex:none;min-height:58px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center}
.result h3{font-size:26px;width:100%}
.result .ghost{padding:8px 12px;font-size:15px}
.result .soft{color:var(--ink-soft);font-size:15px;width:100%}

/* guide */
.glist{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 2px 10px;align-content:start}
@media (min-width:700px){.glist{grid-template-columns:repeat(3,1fr)}}
.gcard{text-align:left;padding:14px 14px 12px;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--paper-deep);display:flex;flex-direction:column;gap:2px;min-height:76px}
.gcard b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.gcard small{color:var(--ink-soft);font-size:13px}
.ghead{display:flex;align-items:center;gap:12px;flex:none}
.ghead img{width:72px;height:72px;object-fit:cover;flex:none}
.ghead p{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.45}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:none;padding:6px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);font-family:var(--display);font-size:17px;border:2px solid transparent;white-space:nowrap}
.tabs button.on{background:var(--wood);color:#FFF6E4}
.gbody{flex:1;min-height:0;overflow:auto;padding:10px 4px 18px;-webkit-user-select:text;user-select:text}
.gbody ol,.gbody ul{margin:0;padding-left:22px}
.gbody > ol > li,.gbody > ul > li{margin:0 0 12px;line-height:1.6;font-size:17px}
.gbody li ul{margin-top:6px}
.gbody li li{margin:0 0 4px;font-size:16px;color:var(--ink-soft);line-height:1.5}
.gbody ol > li::marker{font-family:var(--display);color:var(--wood)}
.gbody ul > li::marker{color:var(--wood)}
.gfoot{flex:none;display:flex;gap:8px}
.gfoot .ghost{flex:1;text-align:center;font-family:var(--display);font-size:16px}


.tog{min-width:112px;height:46px;border-radius:13px;background:var(--paper-deep);font-family:var(--display);font-size:18px;color:var(--ink-soft);padding:0 12px}
.tog.on{background:var(--wood);color:#FFF6E4}
.special{display:flex;flex-direction:column;gap:14px;align-items:center;padding:18px 8px;text-align:center}
.sp-q{margin:0;font-family:var(--display);font-size:22px}
.sp-note{margin:0;color:var(--ink-soft);font-size:15px}
.sp-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.sp-btns .plank{padding:16px;font-family:var(--display);font-size:21px}
.sp-btns .plank[disabled]{filter:grayscale(.7);opacity:.5}
.plank.lose{background:linear-gradient(180deg,#9A8775,#7C6A59);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 4px 0 #554536,0 8px 14px var(--shade)}
.tiein{display:flex;flex-direction:column;gap:8px}
.tiein label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);font-family:var(--name);font-weight:700}
.tiein input{width:90px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);text-align:center;font-family:var(--display);font-size:22px;-webkit-user-select:text;user-select:text}
.team{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-self:center}
.team .chip{font-size:18px;padding:10px 16px}

:root{--theme:#B9773A}
.bar.themed{background:var(--theme);color:#FFF6E4;border-radius:16px;padding:0 6px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bar.themed .iconbtn{color:#FFF6E4}
.bar.themed h2{text-shadow:0 1px 0 rgba(0,0,0,.25)}
.roundbtn{display:flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.18);color:#FFF6E4;font-family:var(--display);font-size:15px;position:relative;white-space:nowrap}
.roundbtn[hidden]{display:none}
.roundbtn svg{width:18px;height:18px}
.dotalert{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#FFD24A;border:2px solid var(--theme);animation:bob 1.2s infinite}
.itemsel .face .ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--theme);margin-right:2px;flex:none}
.itemsel .face .ic svg{width:19px;height:19px;color:#FFF6E4}
#itemName{display:flex;align-items:center;gap:6px}
.itemdesc{border-color:var(--theme)!important;border-style:solid!important;border-width:0 0 0 5px!important}
.tabs button.on{background:var(--theme)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:1px}
.rbig{text-align:center;font-family:var(--display);font-size:40px;color:var(--theme);margin:6px 0}
.rdots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 12px}
.rd{width:26px;height:26px;border-radius:8px;background:var(--card);border:2px solid var(--line);position:relative}
.rd.past{background:var(--paper-deep);opacity:.6}
.rd.ev{border-color:#E2A93B;background:#FBE3A8}
.rd.now{background:var(--theme);border-color:var(--theme);transform:scale(1.15)}
.rd em{position:absolute;inset:8px;border-radius:50%;background:var(--theme);opacity:.6}
.rnotes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rnotes li{padding:10px 12px;border-radius:12px;background:var(--card);font-size:15px;line-height:1.45}
.rnotes li b{font-family:var(--display);font-weight:400;margin-right:6px;color:var(--theme)}
.rnotes li.hot{background:#FBE3A8;color:#3B2414}
.rnotes li.hot b{color:#8C2F3A}

.sheetart{width:104px;height:104px;margin:-62px auto 4px;display:block;border-radius:50%;background:#FDEAC4;object-fit:cover;border:4px solid var(--paper);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.sheet{position:relative}
.emptyart{width:min(46vw,200px);aspect-ratio:1;object-fit:cover;margin:0 auto;border-radius:50%}
.empty p{margin:6px 0 0}
</style>
</head>

};

/* ---------- sound ---------- */
let ac = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null } }
  if(ac.state==="suspended") ac.resume(); return ac; }
document.addEventListener("pointerdown", ()=>{ audio(); }, {once:true});
function tone(freq, dur, type, vol, when){
  const a = audio(); if(!a||!soundOn) return;
  const t = a.currentTime + (when||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function knock(when){
  const a = audio(); if(!a||!soundOn) return;
  const t = a.currentTime + (when||0);
  const len = Math.floor(a.sampleRate*0.05), buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=3;
  const g = a.createGain(); g.gain.value=0.9;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
  tone(320,0.07,"sine",0.12,when);
}
const SFX = {
  tap(){ knock(0); },
  step(up){ tone(up?660:520,0.05,"triangle",0.12); },
  coin(when){ tone(1760,0.12,"sine",0.08,when); tone(2350,0.18,"sine",0.06,(when||0)+0.05); },
  reveal(n){ tone([392,494,587][n]||587,0.25,"triangle",0.16); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.35,"triangle",0.16,i*0.12)); tone(1047,0.8,"triangle",0.12,0.5); tone(1319,0.8,"sine",0.06,0.5); },
  soft(){ tone(440,0.18,"sine",0.1); }
};

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),1800); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); if(id==="score") wake(true); else if(id==="home") wake(false); }
function gameDef(id){ return GAMES.find(g=>g.id===id); }
function saveGame(){ if(game) LS.set("homi.game", game); else LS.del("homi.game"); }

/* ---------- wake lock ---------- */
let lock = null, wantLock = false;
async function wake(on){ wantLock = on;
  try{ if(on && "wakeLock" in navigator && !lock){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null}); }
       if(!on && lock){ await lock.release(); lock=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && wantLock) wake(true); });

/* ---------- splash ---------- */
(function splash(){
  const box = $("#meeples");
  const spots = [[-120,-60,-200],[110,-80,160],[-90,70,240],[130,60,-120],[0,-130,90]];
  spots.forEach((s,i)=>{ const m=el("div","meeple",meeple(COLORS[i])); m.style.setProperty("--dx",s[0]+"px"); m.style.setProperty("--dy",s[1]+"px"); m.style.setProperty("--r",s[2]+"deg"); box.appendChild(m); });
  show("splash"); requestAnimationFrame(()=>$("#splash").classList.add("play"));
  let done=false; const go=()=>{ if(done) return; done=true; renderHome(); show("home"); };
  setTimeout(go, 2700); $("#splash").addEventListener("click", go);
})();

/* ---------- home ---------- */
function renderSoundBtn(){ const b=$("#soundBtn"); b.innerHTML = soundOn?ICON.on:ICON.off; b.setAttribute("aria-label", soundOn?"소리 끄기":"소리 켜기"); }
$("#soundBtn").onclick = ()=>{ soundOn=!soundOn; LS.set("homi.sound",soundOn); renderSoundBtn(); if(soundOn) SFX.soft(); toast(soundOn?"소리를 켰어요":"소리를 껐어요"); };
function renderHome(){
  renderSoundBtn();
  const r=$("#resume");
  if(game && gameDef(game.gameId)){ const g=gameDef(game.gameId); $("#resumeTitle").textContent="진행 중인 판이 있어요"; $("#resumeSub").textContent=g.short+", "+game.players.map(p=>p.name).join(", "); r.hidden=false; }
  else r.hidden=true;
}
$("#resumeGo").onclick=()=>{ SFX.tap(); renderScore(); show("score"); };
$("#resumeDrop").onclick=()=>{ openSheet(`<h3>진행 중인 판을 버릴까요?</h3><p>입력한 점수가 모두 지워져요.</p><div class="row2"><button class="ghost" data-x>그대로 두기</button><button class="plank cta" data-ok>버리기</button></div>`, sh=>{
  sh.querySelector("[data-x]").onclick=closeSheet; sh.querySelector("[data-ok]").onclick=()=>{ game=null; saveGame(); closeSheet(); renderHome(); toast("판을 지웠어요"); }; }); };
$("#goScore").onclick=()=>{ SFX.tap(); if(game){ openSheet(`<h3>진행 중인 판이 있어요</h3><p>새 판을 시작하면 이전 점수는 지워져요.</p><div class="opts"><button data-a="resume">이어하기</button><button data-a="new">새 판 시작</button></div>`, sh=>{
  sh.querySelector('[data-a="resume"]').onclick=()=>{ closeSheet(); renderScore(); show("score"); };

/* ---------- pick game ---------- */
let pickedGame = null;
function openPick(){
  const sel=$("#gameSelect"), list=$("#gameList");
  sel.innerHTML = '<option value="">게임을 골라요</option>' + GAMES.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join("");
  list.innerHTML="";
  GAMES.forEach(g=>{ const b=el("button","gamebtn",`<b><i class="sw" style="background:${THEME[g.id]}"></i>${esc(g.name)}</b><small>${g.min===g.max?g.min+"인 전용":g.min+"–"+g.max+"인"}</small>`); b.dataset.id=g.id; b.onclick=()=>choose(g.id); list.appendChild(b); });
  choose(pickedGame); show("pick");
}
function choose(id){
  pickedGame = id||null; const g = id?gameDef(id):null;
  $("#gameSelect").value = id||"";
  $("#boardName").textContent = g?g.short:"게임을 골라요"; { const L=(g?g.short:"게임을 골라요").length; $("#boardName").style.fontSize = L<=4?"":L<=6?"8.6cqw":"6.8cqw"; }
  $("#boardSub").textContent = g?(g.min===g.max?g.min+"인 전용":g.min+"–"+g.max+"인"):"나무판을 눌러도 돼요";
  document.querySelectorAll(".gamebtn").forEach(b=>b.classList.toggle("sel", b.dataset.id===id));
  $("#pickNext").disabled = !g; if(g) SFX.tap();
}
$("#gameSelect").onchange = e => choose(e.target.value);
$("#pickNext").onclick = ()=>{ SFX.tap(); openPlayers(); };

/* ---------- players ---------- */
let chosen = [];
function openPlayers(){ const g=gameDef(pickedGame); chosen = chosen.filter(n=>names.includes(n)).slice(0,g.max); renderPlayers(); show("players"); }
function renderPlayers(){
  const g=gameDef(pickedGame), list=$("#plist"); list.innerHTML="";
  names.forEach((n,i)=>{
    const on = chosen.includes(n);
    const row = el("div","pl"+(on?" sel":""));
    row.innerHTML = `<span class="dot">${meeple(on?COLORS[chosen.indexOf(n)%5]:"var(--line)")}</span><b>${esc(n)}</b><button class="edit" aria-label="${esc(n)} 이름 바꾸기">수정</button><span class="check" role="checkbox" aria-checked="${on}"></span>`;
    row.onclick = e => { if(e.target.closest(".edit")) return; toggle(n); };
    row.querySelector(".edit").onclick = ()=>editName(i);
    list.appendChild(row);
  });
  const k = chosen.length;
  $("#playerHint").textContent = g.min===g.max ? `${g.short}는 ${g.min}명이 해요. 지금 ${k}명` : `${g.min}–${g.max}명이 할 수 있어요. 지금 ${k}명`;
  $("#startGame").disabled = !(k>=g.min && k<=g.max);
}
function toggle(n){ const g=gameDef(pickedGame);
  if(chosen.includes(n)) chosen=chosen.filter(x=>x!==n);
  else { if(chosen.length>=g.max){ toast(`${g.short}는 최대 ${g.max}명이에요`); return; } chosen.push(n); }
  SFX.tap(); renderPlayers(); }
function editName(i){
  openSheet(`<h3>이름 바꾸기</h3><div class="addp" style="margin-top:12px"><input id="editIn" maxlength="10" value="${esc(names[i])}"></div><div class="row2"><button class="ghost" data-del>삭제</button><button class="plank cta" data-ok>저장</button></div>`, sh=>{
    const inp=sh.querySelector("#editIn"); setTimeout(()=>inp.focus(),50);
    sh.querySelector("[data-ok]").onclick=()=>{ const v=inp.value.trim(); if(!v){toast("이름을 넣어주세요");return;} if(names.some((x,j)=>x===v&&j!==i)){toast("같은 이름이 있어요");return;}
      const old=names[i]; names[i]=v; chosen=chosen.map(x=>x===old?v:x); LS.set("homi.names",names); closeSheet(); renderPlayers(); };
    sh.querySelector("[data-del]").onclick=()=>{ if(names.length<=1){toast("한 명은 남겨야 해요");return;} const old=names[i]; names.splice(i,1); chosen=chosen.filter(x=>x!==old); LS.set("homi.names",names); closeSheet(); renderPlayers(); };
  });
}
$("#addName").onclick = ()=>{ const inp=$("#newName"), v=inp.value.trim(); if(!v) return; if(names.includes(v)){toast("같은 이름이 있어요");return;} names.push(v); LS.set("homi.names",names); inp.value=""; SFX.tap(); renderPlayers(); };

const ROUNDS = {
 agricola:{label:"라운드", total:()=>14, end:{4:"수확",7:"수확",9:"수확",11:"수확",13:"수확",14:"마지막 수확 → 점수 계산"}, start:{6:"돼지가 행동 칸에 나오기 시작해요",8:"소가 행동 칸에 나오기 시작해요",12:"방 없이 가족을 늘리는 칸이 열려요"}, endWord:"수확"},

 arnak:{label:"라운드", total:()=>5, end:{5:"최종 점수 계산"}},
 seti:{label:"라운드", total:()=>5, end:{5:"마지막 사람이 패스하면 최종 점수"}, tip:"점수가 25, 50, 70점을 지날 때마다 골드 타일에 마커를 놓아요."},

 "7wd":{label:"시대", total:()=>3, start:{2:"군사가 약한 쪽이 다음 시대 선을 골라요",3:"군사가 약한 쪽이 다음 시대 선을 골라요"}, end:{3:"즉시 승리가 없었다면 점수 계산"}},
 brass:{label:"라운드", total:n=>2*({2:10,3:9,4:8}[n]||8), era:true, endWord:"시대 끝"},
 tm:{label:"세대", total:()=>0}
};
function roundInfo(gid, n){
  const R = ROUNDS[gid]; if(!R) return null;
  const total = R.total(n); let end = Object.assign({},R.end||{}), start = Object.assign({},R.start||{});
  if(R.era){ const per = total/2; start[1]="첫 라운드는 각자 행동 1번만"; end[per]="운하 시대 끝: 점수 → 레벨 1 산업 제거, 맥주 채우기, 덱 섞고 8장씩"; end[total]="철도 시대 끝: 점수 계산 (이번 라운드엔 수입 없음)"; start[per+1]="철도 시대 시작"; }
  return {R, total, end, start};
}
function roundLabel(gid, n, r){
  const info=roundInfo(gid,n); if(!info) return "";
  if(info.R.era){ const per=info.total/2; return r<=per?`운하 ${r}/${per}`:`철도 ${r-per}/${per}`; }
  return info.total? `${r}/${info.total}` : `${info.R.label} ${r}`;
}
function renderRoundBtn(){
  const btn=$("#roundBtn"); if(!game){ btn.hidden=true; return; }
  const info=roundInfo(game.gameId, game.players.length);
  if(!info){ btn.hidden=true; return; }
  btn.hidden=false; game.round=game.round||1;
  const soon = info.end[game.round];
  btn.innerHTML = `${svgIcon("hourglass")}<span>${roundLabel(game.gameId, game.players.length, game.round)}</span>${soon?'<i class="dotalert"></i>':""}`;
}
function openRounds(){
  const n=game.players.length, info=roundInfo(game.gameId,n), r=game.round||1, total=info.total;
  const nextEnd = Object.keys(info.end).map(Number).filter(x=>x>=r).sort((a,b)=>a-b)[0];
  let dots="";
  if(total){ for(let i=1;i<=total;i++){ const ev=info.end[i], st=info.start[i]; dots+=`<button class="rd${i<r?" past":""}${i===r?" now":""}${ev?" ev":""}" data-r="${i}" aria-label="${i}">${st&&!ev?'<em></em>':""}</button>`; } }
  const lines=[];
  if(info.start[r]) lines.push(`<li><b>이번 ${info.R.label} 시작</b> ${esc(info.start[r])}</li>`);
  if(info.end[r]) lines.push(`<li class="hot"><b>이번 ${info.R.label} 끝</b> ${esc(info.end[r])}</li>`);
  else if(nextEnd) lines.push(`<li><b>다음 일정</b> ${nextEnd}${info.R.label==="시대"?"시대":"라운드"} 끝에 ${esc(info.end[nextEnd])} (${nextEnd-r}${info.R.label==="시대"?"시대":"라운드"} 남음)</li>`);
  if(info.R.tip) lines.push(`<li><b>기억하기</b> ${esc(info.R.tip)}</li>`);
  openSheet(`<img class="sheetart" src="${IMG.hourglass}" alt=""><h3>${esc(gameDef(game.gameId).short)} 진행</h3><div class="rbig">${roundLabel(game.gameId,n,r)}</div>${total?`<div class="rdots">${dots}</div>`:""}<ul class="rnotes">${lines.join("")||"<li>특별한 일정은 없어요.</li>"}</ul><div class="row2"><button class="ghost" data-d="-1">이전</button><button class="plank cta" data-d="1">${total&&r>=total?"마지막이에요":"다음 "+info.R.label+"로"}</button></div>`, sh=>{
    sh.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ game.round=+b.dataset.r; saveGame(); SFX.tap(); renderRoundBtn(); openRounds(); });
    sh.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ const d=+b.dataset.d; const nr=r+d; if(nr<1||(total&&nr>total)) return;
      if(d>0 && info.end[r]){ toast(`${info.end[r]}을(를) 했는지 확인하세요`); SFX.reveal(2); } else SFX.tap();
      game.round=nr; saveGame(); renderRoundBtn(); openRounds(); });
  });
}

$("#startGame").onclick = ()=>{ SFX.tap(); askOptions(pickedGame, chosen.slice()); };

function askOptions(gid, plist){
  const g = gameDef(gid), opts = {}, list = g.options||[];
  let k = 0;
  const next = ()=>{
    if(k>=list.length){ closeSheet(); newGame(gid, plist, opts); return; }
    const op = list[k];
    if(op.multi){
      let sel=[];
      openSheet(`<h3>${esc(op.label)}</h3><p>${op.multi}개를 골라요</p><div class="opts">${op.choices.map(c=>`<button data-v="${c.v}">${esc(c.label)}</button>`).join("")}</div><div class="row2"><button class="ghost" data-x>취소</button><button class="plank cta" data-ok disabled>다음</button></div>`, sh=>{
        const ok=sh.querySelector("[data-ok]");
        sh.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ const v=b.dataset.v; if(sel.includes(v)) sel=sel.filter(x=>x!==v); else if(sel.length<op.multi) sel.push(v); else { toast(op.multi+"개까지만 골라요"); return; }
          b.classList.toggle("on", sel.includes(v)); ok.disabled = sel.length!==op.multi; ok.textContent = sel.length===op.multi?"다음":`${sel.length} / ${op.multi}`; SFX.tap(); });
        ok.textContent = `0 / ${op.multi}`;
        sh.querySelector("[data-x]").onclick=closeSheet;
        ok.onclick=()=>{ opts[op.id]=sel.slice(); k++; next(); };
      });
    } else {
      openSheet(`<h3>${esc(op.label)}</h3><div class="opts" style="margin-top:12px">${op.choices.map(c=>`<button data-v="${c.v}">${esc(c.label)}</button>`).join("")}</div><div class="row2"><button class="ghost" data-x>취소</button></div>`, sh=>{

        sh.querySelector("[data-x]").onclick=closeSheet;
      });
    }
  };
  next();
}

function itemsOf(g, opts){ return typeof g.items==="function" ? g.items(opts||{}) : (g.items||[]); }
function curItems(){ return itemsOf(gameDef(game.gameId), game.opts); }

function newGame(gid, plist, opts){
  const g = gameDef(gid);
  game = { gameId:gid, players:plist.map((n,i)=>({name:n,color:i%5})), values:{}, item:0, opts:opts||{} };
  itemsOf(g, game.opts).forEach(it=>{ game.values[it.id] = plist.map(()=> (it.type==="choice"||it.type==="tag")?null:0); });
  lastSetup = {gid, plist, opts:game.opts}; saveGame(); renderScore(); show("score");
}

/* ---------- score ---------- */
function itemScore(it, v){
  if(it.type==="tag") return 0;
  if(v==null||v==="") return 0; v=+v||0;
  if(it.type==="count") return v*it.mult;
  if(it.type==="coins") return Math.floor(v/it.div);
  if(it.type==="minus") return -Math.abs(v);
  if(it.type==="toggle") return v?it.pts:0;
  return v;
}
function totals(){ const its=curItems(); return game.players.map((p,pi)=> its.reduce((s,it)=>s+itemScore(it, (game.values[it.id]||[])[pi]),0)); }
function calcLine(it,v){
  if(it.type==="count") return `${v||0}${it.unit||""} × ${it.mult} = <b>${itemScore(it,v)}점</b>`;
  if(it.type==="coins") return `${v||0}${it.unit||""} ÷ ${it.div} = <b>${itemScore(it,v)}점</b>`;
  if(it.type==="minus") return `<b>${itemScore(it,v)}점</b>`;
  return "";
}
function renderScore(){
  const g = gameDef(game.gameId);
  $("#scoreTitle").textContent = g.short; applyTheme(g.id); renderRoundBtn();
  const special = g.mode==="versus"||g.mode==="coop";

  $("#itemDesc").style.display = special?"none":"";
  $("#totals").style.display = special?"none":"";
  $("#finish").style.display = special?"none":"";
  $("#instantBtn").hidden = !(g.instant && g.instant.length);
  if(g.instant && g.instant.length) $("#instantBtn").textContent = g.instant.length>1?"즉시 승리":g.instant[0].label;
  if(special){ renderSpecial(g); return; }
  const its = curItems();
  $("#itemSelect").innerHTML = its.map((it,i)=>`<option value="${i}">${i+1}. ${esc(it.name)}</option>`).join("");
  if(game.item>=its.length) game.item=0;
  renderItem();
}
function renderItem(){
  const its = curItems(), it = its[game.item];
  if(!game.values[it.id]) game.values[it.id] = game.players.map(()=> (it.type==="choice"||it.type==="tag")?null:0);
  const vals = game.values[it.id];
  $("#itemSelect").value = game.item;
  $("#itemName").innerHTML = `<span class="ic">${svgIcon(iconFor(game.gameId,it.id))}</span>${esc(it.name)}`; $("#itemPos").textContent = (game.item+1)+" / "+its.length;
  $("#itemDesc").innerHTML = `<b>${esc(it.desc)}</b>${it.how?`<span>${esc(it.how)}</span>`:""}${it.ex?`<i>예) ${esc(it.ex)}</i>`:""}`;
  $("#prevItem").style.visibility = game.item===0?"hidden":"visible";
  $("#nextItem").style.visibility = game.item===its.length-1?"hidden":"visible";
  const rows=$("#rows"); rows.innerHTML="";
  game.players.forEach((p,pi)=>{
    const r = el("div","row"), calc = calcLine(it, vals[pi]);
    r.innerHTML = `<div class="who">${meeple(COLORS[p.color])}<div style="min-width:0"><b>${esc(p.name)}</b>${calc?`<div class="calc">${calc}</div>`:""}</div></div>`;
    if(it.type==="choice" || it.type==="tag"){
      const c = el("div","choices");
      it.choices.forEach(v=>{ const b=el("button", vals[pi]===v?"on":"", esc(String(v))); b.onclick=()=>{ vals[pi]= vals[pi]===v && it.type==="tag" ? null : v; SFX.tap(); saveGame(); renderItem(); }; c.appendChild(b); });
      if(it.type==="tag") c.style.cssText="flex-wrap:wrap;justify-content:flex-end;max-width:62%";
      r.appendChild(c);
    } else if(it.type==="toggle"){
      const b = el("button","tog"+(vals[pi]?" on":""), vals[pi]?`있음 +${it.pts}`:"없음");
      b.onclick=()=>{ const nv = vals[pi]?0:1; if(nv && it.exclusive) vals.fill(0); vals[pi]=nv; SFX.tap(); saveGame(); renderItem(); };
      r.appendChild(b);
    } else {
      const s = el("div","step");
      const neg = it.allowNeg;
      s.innerHTML = `<button aria-label="${esc(p.name)} 1 빼기">−</button><input inputmode="${neg?"text":"numeric"}" ${neg?"":'pattern="[0-9]*"'} value="${vals[pi]||0}" aria-label="${esc(p.name)} ${esc(it.name)}"><button aria-label="${esc(p.name)} 1 더하기">+</button>`;
      const [minus, inp, plus] = s.children;
      const refresh = ()=>{ const c=r.querySelector(".calc"); if(c) c.innerHTML=calcLine(it, vals[pi]); renderTotals(); };
      const setV = v => { if(!neg && v<0) v=0; vals[pi]=v; inp.value=v; saveGame(); refresh(); };
      minus.onclick = ()=>{ SFX.step(false); setV((+vals[pi]||0)-1); };
      plus.onclick = ()=>{ SFX.step(true); setV((+vals[pi]||0)+1); };
      inp.onfocus = ()=>inp.select();
      inp.oninput = ()=>{ const n=parseInt(inp.value.replace(neg?/[^0-9-]/g:/[^0-9]/g,""),10); vals[pi]=isNaN(n)?0:n; saveGame(); refresh(); };
      inp.onblur = ()=>{ inp.value = vals[pi]||0; };
      r.appendChild(s);
    }
    rows.appendChild(r);
  });
  renderTotals();
}
function renderTotals(){
  const t = totals(), max = Math.max(...t), box=$("#totals"); box.innerHTML="";
  game.players.forEach((p,pi)=>{ box.appendChild(el("div","tot"+(t[pi]===max&&max>0?" lead":""), `${meeple(COLORS[p.color])}<span class="n">${esc(p.name)}</span> <b>${t[pi]}</b>`)); });
}
function goItem(i){ const its=curItems(); if(i<0||i>=its.length) return; game.item=i; saveGame(); SFX.tap(); renderItem(); }
$("#prevItem").onclick = ()=>goItem(game.item-1);

$("#rows").addEventListener("touchend",e=>{ if(swipeX==null||!game) return; const g=gameDef(game.gameId); if(g.mode) { swipeX=null; return; } const dx=e.changedTouches[0].clientX-swipeX; if(Math.abs(dx)>70) goItem(game.item+(dx<0?1:-1)); swipeX=null; });

$("#finish").onclick = ()=>{

function coopEnd(win, why){

/* ---------- ranking & tie-break ---------- */
function resolveAndAward(){
  const g=gameDef(game.gameId), t=totals();
  const res = game.players.map((p,pi)=>({pi, name:p.name, color:p.color, total:t[pi], keys:[]}));
  const crit = g.tie||[];
  const keyStr = (r,ci)=> [r.total].concat(r.keys.slice(0,ci)).join("|");
  const groupsAt = ci => { const m={}; res.forEach(r=>{ (m[keyStr(r,ci)]=m[keyStr(r,ci)]||[]).push(r); }); return Object.values(m).filter(a=>a.length>1); };
  const step = ci => {
    if(ci>=crit.length){ runTally(rank(res)); return; }
    const c = crit[ci], top = Math.max(...res.map(r=>r.total)), groups = groupsAt(ci).filter(gp=>!c.topOnly || gp[0].total===top);
    res.forEach(r=>{ r.keys[ci]=0; });
    if(!groups.length){ step(ci+1); return; }
    if(c.item){ const it=curItems().find(x=>x.id===c.item); res.forEach(r=>{ r.keys[ci]= it? itemScore(it, game.values[it.id][r.pi]) : 0; }); step(ci+1); return; }
    if(c.calc==="goldRem"){ res.forEach(r=>{ r.keys[ci]=(+game.values.gold[r.pi]||0)%3; }); step(ci+1); return; }
    let gi=0;
    const ask = ()=>{
      if(gi>=groups.length){ step(ci+1); return; }
      const grp = groups[gi++], head = `${grp[0].total}점 동점이에요`;
      if(c.pick){
        openSheet(`<img class="sheetart" src="${IMG.think}" alt=""><h3>${head}</h3><p>${esc(c.pick)}</p><div class="opts">${grp.map(r=>`<button data-pi="${r.pi}">${esc(r.name)}</button>`).join("")}<button data-pi="-1">해당 없음</button></div>`, sh=>{
          sh.querySelectorAll("[data-pi]").forEach(b=>b.onclick=()=>{ const sel=+b.dataset.pi; grp.forEach(r=>{ r.keys[ci]= r.pi===sel?1:0; }); closeSheet(); ask(); }); });
      } else {
        openSheet(`<img class="sheetart" src="${IMG.think}" alt=""><h3>${head}</h3><p>동점을 가리려면 ${esc(c.ask)}를 넣어요</p><div class="tiein">${grp.map(r=>`<label><span>${esc(r.name)}</span><input inputmode="numeric" pattern="[0-9]*" data-pi="${r.pi}" value="0"></label>`).join("")}</div><div class="row2"><button class="plank cta" data-ok>확인</button></div>`, sh=>{
          sh.querySelectorAll("input").forEach(i=>i.onfocus=()=>i.select());
          sh.querySelector("[data-ok]").onclick=()=>{ sh.querySelectorAll("input").forEach(i=>{ const r=grp.find(x=>x.pi===+i.dataset.pi); r.keys[ci]=parseInt(i.value,10)||0; }); closeSheet(); ask(); }; });
      }
    };
    ask();
  };
  step(0);
}
function rank(res){
  const cmp=(a,b)=>{ if(b.total!==a.total) return b.total-a.total; for(let i=0;i<Math.max(a.keys.length,b.keys.length);i++){ const d=(b.keys[i]||0)-(a.keys[i]||0); if(d) return d; } return 0; };
  res.sort(cmp); res.forEach((r,i)=>{ r.place = (i>0 && cmp(res[i-1],r)===0) ? res[i-1].place : i+1; });
  return res;
}

/* ---------- tally & award ---------- */
function runTally(ranked, info){
  show("tally"); [0,.35,.7,1.05,1.4,1.75].forEach(w=>SFX.coin(w));
  let done=false; const go=()=>{ if(done) return; done=true; award(ranked, info||{}); };
  const tm=setTimeout(go,2600); $("#tally").onclick=()=>{ clearTimeout(tm); go(); };
}
function award(ranked, info){
  const g=gameDef(game.gameId);
  lastSetup = {gid:game.gameId, plist:game.players.map(p=>p.name), opts:game.opts};
  game=null; saveGame();
  show("award"); $("#award .crown").src = IMG.award;
  $("#awardTitle").textContent="두구두구"; $("#awardSub").textContent = info.note||g.short;
  const pod=$("#podium"); pod.innerHTML=""; $("#rest").classList.remove("show"); $("#confetti").innerHTML="";
  const top = ranked.slice(0,3); pod.style.gridTemplateColumns = `repeat(${top.length},1fr)`;
  const spots = top.map((r,i)=>{ const s=el("div","spot s"+Math.min(r.place,3));
    const sub = r.total!=null ? r.total+"점" : (r.tag||"");
    s.innerHTML = `${meeple(COLORS[r.color]).replace("<svg",'<svg class="m"')}<div class="nm">${esc(r.name)}</div><div class="pt">${esc(sub)}</div><div class="block plank">${r.place}</div>`;
    pod.appendChild(s); return s; });
  const rest = ranked.slice(3); $("#rest").innerHTML = rest.map(r=>`${r.place}등 ${esc(r.name)}${r.total!=null?" "+r.total+"점":(r.tag?" "+esc(r.tag):"")}`).join("<span aria-hidden='true'>　</span>");
  const order = [2,1,0].filter(i=>spots[i]);
  let k=0; const timers=[];
  const step = ()=>{ if(k>=order.length) return; const i=order[k++]; spots[i].classList.add("show");
    if(i===0){ SFX.fanfare(); const winners=ranked.filter(r=>r.place===1).map(r=>r.name);
      $("#awardTitle").textContent = info.title || (winners.length>1? `공동 1등! ${winners.join(", ")}` : `${winners[0]} 1등!`); confetti(); $("#rest").classList.add("show"); }
    else SFX.reveal(2-i);
    if(k<order.length) timers.push(setTimeout(step, 1100)); };
  timers.push(setTimeout(step, 500));
  $("#award").onclick = e=>{ if(e.target.closest("button")) return; timers.forEach(clearTimeout); while(k<order.length) step(); };
}
function confetti(){ const box=$("#confetti"); const cs=["#E2A93B","#C8433A","#3A6EA5","#4E8A3E","#7B4F9D","#F6D9A2"];
  for(let i=0;i<60;i++){ const c=el("i"); c.style.left=Math.random()*100+"%"; c.style.background=cs[i%cs.length]; c.style.animationDuration=(1.8+Math.random()*1.6)+"s"; c.style.animationDelay=(Math.random()*.6)+"s"; box.appendChild(c); } }
$("#again").onclick = e=>{ e.stopPropagation(); SFX.tap(); if(lastSetup) newGame(lastSetup.gid, lastSetup.plist, lastSetup.opts); };
$("#awardHome").onclick = e=>{ e.stopPropagation(); SFX.tap(); renderHome(); show("home"); };

/* ---------- instant win ---------- */

가 핵심 구간을 남에게 뺏김."}, {"x": "게임 끝 신호(기차 2개 이하)를 놓쳐서 마지막 턴을 대비 못 함."}]}, {"t": "전략 팁", "items": [{"x": "긴 노선일수록 칸당 점수가 높아요. 6칸은 15점이에요."}, {"x": "대체 경로가 없는 좁은 구간은 먼저 잡으세요."}, {"x": "목적지 티켓은 이미 깔린 내 노선과 겹치는 걸 고르세요."}]}]}, {"id": "7wd", "name": "세븐 원더스 듀얼", "short": "7원더스 듀얼", "min": 2, "max": 2, "intro": "세 시대에 걸쳐 카드를 가져가며 문명을 키워요. 군사나 과학으로 즉시 이기거나, 3시대 끝에 점수가 높으면 이겨요. 2인 전용, 30분.", "tabs": [{"t": "흐름", "items": [{"x": "시대마다 카드를 정해진 모양으로 펼쳐요. 일부는 뒷면이에요."}, {"x": "내 턴에 위가 가려지지 않은 카드 1장을 가져와서 셋 중 하나를 해요.", "sub": ["비용을 내고 짓기", "버리고 동전 받기 (2 + 내 노란 카드 수)", "경이 짓는 데 쓰기"]}, {"x": "카드를 가져가서 드러난 뒷면 카드는 바로 뒤집어요."}, {"x": "3시대가 끝나면 점수 계산."}]}, {"t": "세팅", "items": [{"x": "각자 동전 7개."}, {"x": "진보 토큰 5개를 보드에 무작위로 놓아요."}, {"x": "군사 말은 가운데."}, {"x": "경이 8개를 4장씩 두 번에 나눠, 1-2-1 순서로 골라 각자 4개씩 가져요."}]}, {"t": "턴 체크", "items": [{"x": "같은 과학 기호 2개가 모였나? 진보 토큰 1개를 골라요."}, {"x": "군사 말이 상대 수도에 닿으면 즉시 승리."}, {"x": "서로 다른 과학 기호 6개를 모으면 즉시 승리."}, {"x": "연결 기호가 있는 건물은 무료로 지을 수 있어요."}, {"x": "경이는 둘이 합쳐 7개까지만. 7번째가 지어지면 남은 1개는 버려요."}]}, {"t": "초보 실수", "items": [{"x": "내가 카드를 가져가면서 상대에게 좋은 카드를 열어줌."}, {"x": "상대 과학이나 군사를 신경 안 쓰다가 즉시 패배."}, {"x": "자원 살 때 비용 계산 실수. 은행 가격은 2 + 상대가 생산하는 그 자원 수예요."}]}, {"t": "전략 팁", "items": [{"x": "상대가 노리는 카드는 버리거나 경이 재료로 써서 막으세요."}, {"x": "다시 턴을 주는 경이는 연속 행동으로 흐름을 잡기 좋아요."}, {"x": "다음 시대 선을 고르는 건 군사가 약한 쪽이에요."}, {"x": "동점이면 파란 건물 점수가 높은 사람이 이겨요."}]}]}, {"id": "brass", "name": "브라스 버밍엄", "short": "브라스", "min": 2, "max": 4, "intro": "운하 시대와 철도 시대 두 번에 걸쳐 산업과 연결로를 짓고, 시대 끝마다 점수를 받아요. 2–4인, 1–2시간.", "tabs": [{"t": "흐름", "items": [{"x": "시대마다 라운드 수가 정해져 있어요. 4인 8라운드, 3인 9라운드, 2인 10라운드."}, {"x": "내 턴엔 행동 2번. 운하 시대 첫 라운드만 1번이에요. 행동할 때마다 카드 1장을 버려요.", "sub": ["건설: 산업 타일 놓기", "연결: 운하 또는 철도 놓기", "개발: 철을 써서 낮은 레벨 타일 치우기", "판매: 면, 공산품, 도자기를 상인에게 팔기(필요하면 맥주 사용)", "대출: 30파운드 받고 수입 마커를 3레벨 내리기", "정찰: 카드 3장 버리고 와일드 산업 1장 + 와일드 장소 1장 받기", "패스: 행동 대신 카드만 버리기"]}, {"x": "쓴 돈은 내 캐릭터 타일 위에 올려둬요. 다음 라운드 순서를 정할 때 써요."}, {"x": "턴이 끝나면 손패를 8장까지 채워요. 덱이 떨어지면 손패가 점점 줄어요."}, {"x": "라운드 끝", "sub": ["돈을 가장 적게 쓴 사람이 다음 라운드 선이에요. 같으면 원래 순서 유지. 그다음 쓴 돈을 은행에 돌려놔요.", "수입 마커 옆 숫자만큼 돈을 받아요. 게임 마지막 라운드엔 수입이 없어요."]}, {"x": "시대 끝(모두 손패를 다 쓴 라운드 뒤): 링크 점수 → 뒤집힌 산업 점수를 트랙에 올려요."}, {"x": "운하 시대 끝에만 추가로: 보드의 레벨 1 산업을 모두 박스로, 상인 옆 빈 맥주 칸 채우기, 버린 카드 다 섞어 새 덱, 각자 8장 뽑기. 그다음 철도 시대."}]}, {"t": "세팅", "items": [{"x": "인원에 맞게 상인 타일과 카드 덱을 조정해요."}, {"x": "각자 시작 자금과 수입 위치는 룰북 세팅 표를 따라요."}]}, {"t": "턴 체크", "items": [{"x": "석탄은 내 네트워크에 연결된 곳에서만 쓸 수 있어요. 철은 연결 없이도 돼요."}, {"x": "판매하려면 맥주가 필요해요. 내 양조장은 어디서든, 남의 양조장은 연결돼 있어야 해요."}, {"x": "운하 시대엔 한 도시에 내 산업 1개까지만."}, {"x": "대출은 3칸이 아니라 3레벨이에요."}, {"x": "와일드 카드가 손에 있으면 정찰을 못 해요."}]}, {"t": "초보 실수", "items": [{"x": "운하 시대 끝에 레벨 1 산업이 사라지는 걸 잊음."}, {"x": "대출을 너무 많이 받아서 수입이 마이너스로 떨어짐. 돈이 모자라면 내 산업 타일을 건설비 절반(내림)에 팔아서 메워야 하고, 그래도 모자라면 1파운드당 1점을 잃어요."}, {"x": "산업을 뒤집지 못한 채 시대가 끝남. 안 뒤집힌 타일은 0점이에요."}, {"x": "소득 트랙을 점수로 착각함. 소득은 최종 점수가 아니에요(동점일 때만 써요)."}, {"x": "철도 시대 이중 연결에 맥주가 필요한 걸 모름."}]}, {"t": "전략 팁", "items": [{"x": "초반엔 수입을 올리는 게 후반 점수보다 중요해요."}, {"x": "남이 내 석탄이나 철을 쓰면 내 타일이 뒤집혀서 이득이에요."}, {"x": "링크 점수는 양쪽 끝 장소의 링크 아이콘 합이라, 산업이 많은 곳을 잇는 게 좋아요."}, {"x": "동점이면 수입 → 남은 돈 순서로 가려요. 끝이 비슷하면 수입을 지키세요."}]}]}, {"id": "arnak", "name": "로스트 루인스 오브 아르낙", "short": "아르낙", "min": 1, "max": 4, "intro": "덱을 키우면서 섬을 탐험하고, 연구 트랙을 올려 점수를 내요. 1–4인, 5라운드, 60–120분.", "tabs": [{"t": "흐름", "items": [{"x": "라운드마다 카드 5장을 들고 시작해요."}, {"x": "내 턴에 주 행동 1개를 해요. 아무것도 못 하면 패스.", "sub": ["발굴: 이동 카드를 내고 고고학자를 유적지에 놓아 자원 받기", "새 유적 발견: 나침반과 이동 비용을 내고 새 장소 열기. 우상을 받고 수호자가 나타나요", "수호자 물리치기: 비용을 내고 수호자 카드 획득", "카드 사기: 아티팩트는 나침반, 아이템은 동전으로", "카드 효과 쓰기", "연구: 자원을 내고 돋보기나 노트를 트랙 위로"]}, {"x": "모두 패스하면 라운드 끝. 고고학자 회수, 카드 정리, 다시 5장."}, {"x": "5라운드 후 최종 점수 계산."}]}, {"t": "세팅", "items": [{"x": "각자 고고학자 2명과 시작 덱. 시작 덱에 공포 카드 2장이 들어 있어요."}, {"x": "보드 앞면(새의 신전)과 뒷면(뱀의 신전) 중 선택."}]}, {"t": "턴 체크", "items": [{"x": "발굴 장소의 이동 아이콘(발, 차, 배, 비행기)과 낸 카드가 맞나?"}, {"x": "내 고고학자가 있는 곳에 수호자가 남은 채로 라운드가 끝나면 공포 카드를 받아요."}, {"x": "노트는 돋보기보다 위로 갈 수 없어요."}, {"x": "아티팩트는 사자마자 효과를 한 번 쓸 수 있어요."}]}, {"t": "초보 실수", "items": [{"x": "새 유적을 열고 수호자를 방치해서 공포 카드가 쌓임. 공포 카드는 끝에 장당 −1점이에요."}, {"x": "덱에 카드를 너무 많이 넣어서 좋은 카드가 안 나옴."}, {"x": "연구 트랙을 늦게 시작해서 후반 점수를 놓침."}, {"x": "우상을 슬롯에 쓰면 점수가 없어진다고 착각함. 우상은 슬롯에 놔도 3점이에요. 대신 그 칸에 인쇄된 빈 슬롯 점수를 잃어요."}]}, {"t": "전략 팁", "items": [{"x": "연구 트랙이 가장 큰 점수원이에요. 꾸준히 올리세요. 잃어버린 신전 줄은 먼저 도착할수록 점수가 커요."}, {"x": "수호자는 하나당 5점이에요. 혜택을 써도 점수는 그대로라, 잡을 수 있으면 잡으세요."}, {"x": "공포 카드는 제거할 기회가 오면 바로 없애세요."}, {"x": "동점이면 잃어버린 신전에 먼저 간 사람이 이겨요."}]}]}, {"id": "seti", "name": "세티 (SETI)", "short": "세티", "min": 1, "max": 4, "intro": "탐사선을 보내고 망원경으로 신호를 찾아, 외계 생명의 흔적을 먼저 밝혀내는 게임이에요. 1–4인, 5라운드, 약 2시간.", "tabs": [{"t": "흐름", "items": [{"x": "내 턴에 주 행동 1개와 원하는 만큼의 무료 행동을 해요."}, {"x": "주 행동 예시", "sub": ["탐사선 발사: 크레딧을 내고 지구에서 출발", "궤도 진입 또는 착륙: 행성에서 점수와 보너스", "망원경 스캔: 섹터에 신호 표시", "데이터 분석: 모은 데이터를 컴퓨터에 넣고 분석", "카드 플레이 또는 기술 연구"]}, {"x": "모두 패스하면 라운드 끝. 수입을 받고 태양계가 회전해요."}, {"x": "외계 흔적이 충분히 모이면 외계 종족이 공개되고, 그 종족만의 규칙이 추가돼요."}, {"x": "5라운드에서 마지막 사람이 패스하면 최종 점수: 종료 득점 카드(금색 박스) + 골드 점수 타일 + 일부 외계 종족 점수."}]}, {"t": "세팅", "items": [{"x": "외계 종족 카드 2장을 뒷면으로 놓아요."}, {"x": "태양계 원판을 무작위로 돌려 시작 위치를 정해요."}, {"x": "골드 점수 타일 4개(기술, 임무, 수입, 기타)를 앞면이나 뒷면으로 깔아요."}]}, {"t": "턴 체크", "items": [{"x": "탐사선 이동에 쓴 에너지 계산이 맞나?"}, {"x": "섹터 신호가 다 차면 그 섹터 정산을 했나?"}, {"x": "점수가 25, 50, 70점을 지났나? 지날 때마다 골드 점수 타일 하나에 마커를 놓아요. 네 개 중 세 개만 고를 수 있어요."}]}, {"t": "초보 실수", "items": [{"x": "태양계 회전으로 탐사선 위치가 바뀌는 걸 계산 안 함."}, {"x": "데이터를 모아만 두고 분석을 미룸."}, {"x": "외계 종족 공개 후 바뀐 규칙을 놓침. 종족 규칙지는 그 종족이 공개될 때 읽어요."}, {"x": "수입 골드 타일을 셀 때 시작 수입 카드까지 세요. 시작 카드는 빼야 해요."}]}, {"t": "전략 팁", "items": [{"x": "골드 타일은 먼저 마커를 놓을수록 높은 점수 칸을 차지해요. 25점을 빨리 넘기는 게 중요해요."}, {"x": "망원경, 탐사선, 컴퓨터 중 하나에 집중하면 효율이 좋아요."}, {"x": "다른 사람이 신호를 모으는 섹터에 같이 들어가면 정산을 앞당길 수 있어요."}, {"x": "행동 비용과 외계 종족별 세부 규칙은 박스 룰북을 따라요."}]}]}, {"id": "harmonies", "name": "하모니즈", "short": "하모니즈", "min": 1, "max": 4, "intro": "토큰을 쌓아 숲, 산, 강, 들판을 만들고, 그 풍경에 맞는 동물을 데려와요. 1–4인, 30–45분.", "tabs": [{"t": "흐름", "items": [{"x": "가운데 보드에서 토큰 3개 묶음을 가져와 내 보드에 모두 놓아요. 필수예요."}, {"x": "원하면 동물 카드 1장을 가져와요. 앞에 둘 수 있는 미완성 카드는 4장까지."}, {"x": "동물 카드의 지형 모양이 내 보드에 맞으면 동물 큐브를 올려요."}, {"x": "끝나는 조건 둘 중 하나: 중앙 보드를 채워야 하는데 주머니가 비었을 때, 또는 내 턴이 끝났을 때 내 보드 빈칸이 2개 이하일 때. 모두 같은 턴 수가 되도록 그 라운드는 끝까지 해요."}]}, {"t": "세팅", "items": [{"x": "보드 A면(물 = 강)과 B면(물 = 섬) 중 선택. 물 점수 방식이 달라요."}, {"x": "동물 카드 5장 공개, 가운데 보드에 토큰 3개씩 채우기."}, {"x": "정령 카드 변형을 쓰면 시작할 때 1장 골라요."}]}, {"t": "턴 체크", "items": [{"x": "쌓기 규칙: 산(회색)은 회색 위로 3층까지. 나무는 갈색 0–2개 위에 초록 1개. 건물(빨강)은 갈색, 회색, 빨강 위에."}, {"x": "노랑(들판)과 파랑(물)은 위에 아무것도 못 쌓아요."}, {"x": "동물 카드의 모양을 돌려서 맞춰도 되지만 뒤집으면 안 돼요."}, {"x": "토큰 3개를 이번 턴에 다 놓았나?"}]}, {"t": "초보 실수", "items": [{"x": "동물 카드를 4장 꽉 채워서 새 카드를 못 받음."}, {"x": "강을 여러 갈래로 끊어 놓음(A면). 가장 긴 강 하나만 점수예요."}, {"x": "산을 혼자 떨어뜨려 놓음. 다른 산과 붙어 있어야 점수가 나요."}, {"x": "밭을 하나로 크게 만듦. 밭은 크기와 상관없이 덩어리당 5점이에요."}, {"x": "건물 주변 색을 안 따짐. 주변 맨 위 색이 3가지 이상이어야 5점이에요."}]}, {"t": "전략 팁", "items": [{"x": "나무와 산은 3층이면 7점이라, 높이 쌓을수록 크게 올라요."}, {"x": "같은 지형으로 여러 동물 카드를 채울 수 있게 계획하세요."}, {"x": "미완성 동물 카드도 큐브가 빠진 칸만큼 점수가 나요. 끝나갈 때 한 칸이라도 더 빼세요."}, {"x": "동점이면 동물 큐브를 더 많이 놓은 사람이 이겨요."}]}]}, {"id": "gwt", "name": "그레이트 웨스턴 트레일 (2판)", "short": "웨스턴 트레일", "min": 1, "max": 4, "intro": "소 떼를 몰고 트레일을 따라 캔자스시티까지 가서, 기차로 도시에 배달해요. 건물, 노동자, 소 카드로 엔진을 키워요. 1–4인, 75–150분.", "tabs": [{"t": "흐름", "items": [{"x": "내 소몰이꾼을 이동 한도 안에서 앞으로 옮겨요."}, {"x": "멈춘 곳의 행동을 해요. 중립 건물이나 내 건물은 그 칸의 행동, 남의 건물은 통행료를 내요."}, {"x": "손 한도까지 카드를 다시 채워요."}, {"x": "캔자스시티에 도착하면", "sub": ["다음 회차용 타일을 골라요", "손에 든 소 카드 중 서로 다른 품종 값의 합만큼 돈을 받아요", "그 금액 이하의 도시로 배달해요. 기차가 뒤처져 있으면 운송비를 내요", "시멘탈 소 카드는 캔자스시티에 올 때마다 다음 단계로 업그레이드할 수 있어요"]}, {"x": "소몰이꾼은 출발점으로 돌아가 다시 시작해요."}, {"x": "게임 끝: 노동자 타일을 구인 시장 마지막 칸에 놓으면 구인 시장 토큰이 빠져나와요. 그 사람이 토큰을 가져가고(2점), 나머지 사람들은 한 턴씩만 더 해요."}]}, {"t": "세팅", "items": [{"x": "각자 시작 덱 14장, 손 한도 4장, 이동 한도 3칸에서 시작."}, {"x": "중립 건물 A부터 G까지 트레일에 놓아요."}, {"x": "시멘탈 변형을 쓰면 1단계 시멘탈 카드 8장을 시장 소 카드에 섞어요."}]}, {"t": "턴 체크", "items": [{"x": "이동 칸 수가 한도 안인가? 위험 타일과 무법자 타일 칸은 빈칸으로 세지 않아요."}, {"x": "같은 행동을 한 턴에 두 번 하지는 않았나?"}, {"x": "턴 끝에 손 한도까지 카드를 채웠나?"}]}, {"t": "초보 실수", "items": [{"x": "손 품종을 다양하게 안 만들고 캔자스시티에 도착해서 배달 금액이 낮음."}, {"x": "기차를 안 올려서 운송비만 계속 냄."}, {"x": "건물을 늦게 지어서 남의 건물에 통행료를 냄."}, {"x": "목표 카드를 목표 영역에 넣고 못 채움. 영역에 있는 카드는 무조건 정산이라 못 채우면 마이너스예요. 덱에 있는 카드는 끝에 넣을지 말지 고를 수 있어요."}, {"x": "재해 타일이 감점이라고 착각함. 재해 타일은 플러스 점수예요."}]}, {"t": "전략 팁", "items": [{"x": "소 카드, 기차, 건물 중 하나를 주력으로 정하세요. 다 하면 다 어중간해요."}, {"x": "캔자스시티에서 멀리 있는 도시로 배달할수록 점수가 커요."}, {"x": "노동자 줄 5·6번째 칸은 노동자당 4점이라 후반에 노려볼 만해요."}, {"x": "동점이면 공동 우승이에요."}]}]}, {"id": "alchemists", "name": "알케미스트", "short": "알케미스트", "min": 2, "max": 4, "intro": "재료를 섞어 실험하면서 각 재료의 숨은 성질을 추리하고, 학설을 발표해 명성을 얻어요. 2–4인, 6라운드, 2시간 내외. 재료 혼합 결과는 전용 앱으로 확인해요.", "tabs": [{"t": "흐름", "items": [{"x": "순서 트랙에서 자리를 골라요. 빨리 할수록 받는 카드나 혜택이 적어요."}, {"x": "행동 칸에 행동 큐브를 놓아요. 칸마다 위에서 아래로 처리해요.", "sub": ["재료 수집, 재료 변환(재료 1장 → 금화 1개)", "아이템 구입", "물약 팔기(2라운드부터)", "학설 발표 또는 지지, 학설 반박(학설 반박은 2라운드부터)", "학생에게 시험하기, 물약 마시기"]}, {"x": "라운드 끝: 최고의 연금술사 상, 쓰지 않은 큐브 2개당 호의 카드 1장, 새 모험가, 3·5라운드 끝엔 학회."}, {"x": "6라운드엔 물약 전시회가 열려요. 끝나면 최종 점수를 계산하고 정답을 공개해요."}]}, {"t": "세팅", "items": [{"x": "앱에서 새 게임을 시작해서 정답을 무작위로 정해요."}, {"x": "각자 추리 용지, 결과 보드, 재료 카드와 금화를 받아요."}, {"x": "첫 게임은 수습생 규칙(재료 카드 3장)을 권해요. 마스터 규칙은 2장으로 시작하고 학회와 반박 규칙이 더 엄격해요."}]}, {"t": "턴 체크", "items": [{"x": "실험 결과를 추리 용지에 바로 기록했나?"}, {"x": "학생이 음성 물약을 마시면 그다음 시험하는 사람부터 금화 1개씩 내야 해요."}, {"x": "학설 발표: 금화 1개를 내고 명성 +1. 지지: 은행에 금화 1개 + 먼저 인장을 놓은 사람마다 금화 1개, 명성은 안 올라요. 4인 게임에선 인장 3개가 놓인 학설은 지지 못 해요."}, {"x": "반박에 성공하면 명성 +2, 실패하면 −1."}]}, {"t": "초보 실수", "items": [{"x": "실험 결과를 기록 안 하고 기억에 의존함."}, {"x": "확신 없이 별 있는 인장을 붙였다가 마지막에 −4점씩 감점."}, {"x": "명성 구간을 모름. 초록(14–17)과 파랑(18 이상)은 명성을 잃을 때 더 많이 잃어요."}, {"x": "남은 호의 카드를 그냥 버림. 끝에 장당 금화 2개로 바꿔요."}]}, {"t": "전략 팁", "items": [{"x": "확신이 없으면 별 없는 인장으로 거세요. 회피를 제대로 하면 틀려도 0점이에요. 별 인장은 맞으면 금별 5점, 은별 3점이지만 틀리면 −4점이에요."}, {"x": "남의 틀린 학설을 반박하면 명성을 크게 올릴 수 있어요."}, {"x": "보조금은 받는 즉시 금화 2개, 끝에 1–2점이에요. 학설 두 개를 빨리 걸어서 먼저 받으세요."}, {"x": "금화는 3개당 1점이라, 남는 금화는 아이템에 쓰는 게 나아요."}]}]}, {"id": "gah", "name": "그랜드 오스트리아 호텔", "short": "오스트리아 호텔", "min": 2, "max": 4, "intro": "빈의 호텔을 운영하면서 손님 주문을 채우고 객실에 모셔 점수를 받아요. 2–4인, 7라운드, 1–2시간.", "tabs": [{"t": "흐름", "items": [{"x": "라운드 시작에 선 플레이어가 주사위를 굴려 숫자별 행동 칸에 놓아요."}, {"x": "한 라운드에 각자 두 번 행동해요. 순서는 1-2-3-4-4-3-2-1처럼 갔다 돌아와요."}, {"x": "내 턴에", "sub": ["원하면 대기 줄에서 손님 1명을 데려와 카페에 앉혀요", "주사위 1개를 골라 그 숫자의 행동을 해요. 그 칸에 남은 주사위 수가 행동 강도예요", "추가로 직원 카드를 내거나, 주문을 다 채운 손님을 객실로 보내요"]}, {"x": "3, 5, 7라운드 끝에 황제 정산이 있어요. 황제 트랙 위치에 따라 보상을 받거나 벌칙을 받고, 마커를 뒤로 물려요."}, {"x": "7라운드 황제 정산 뒤 최종 정산: 직원 카드(→| 표시) → 손님 든 방 → 남은 음식·음료·돈 → 카페 손님 감점."}]}, {"t": "세팅", "items": [{"x": "각자 호텔 보드, 시작 객실 준비, 직원 카드 6장 중 일부 선택."}, {"x": "정치 카드 3장 공개."}]}, {"t": "턴 체크", "items": [{"x": "카페 손님은 3명까지만."}, {"x": "객실은 같은 색 손님만, 이미 준비된 방에만 들어가요."}, {"x": "황제 정산 라운드가 다가오면 황제 트랙을 확인했나?"}]}, {"t": "초보 실수", "items": [{"x": "객실을 미리 준비 안 해서 주문 다 채운 손님을 못 보냄."}, {"x": "황제 트랙을 방치해서 정산 때 벌칙."}, {"x": "끝날 때 카페에 손님을 남겨둠. 한 명당 −5점이에요. 카드 위에 음식을 얼마나 올렸든 상관없어요."}, {"x": "남은 돈을 다 써버림. 끝에 1크로네당 1점이에요."}]}, {"t": "전략 팁", "items": [{"x": "손님 든 방은 1층 1점, 2층 2점, 3층 3점, 4층 4점이에요. 위층 방을 채울수록 끝 점수가 커요."}, {"x": "같은 색 객실을 묶어 채우면 보너스가 있어요."}, {"x": "정치 카드는 먼저 달성할수록 점수가 커요."}, {"x": "주사위가 많이 몰린 칸은 강도가 세서 남보다 먼저 가져가면 이득이에요."}, {"x": "동점이면 남은 음식·음료·돈 점수가 높은 사람이 이겨요."}]}]}, {"id": "root", "name": "루트", "short": "루트", "min": 2, "max": 4, "intro": "숲을 두고 세력마다 완전히 다른 방식으로 싸워요. 30점을 먼저 내면 이겨요. 2–4인, 60–90분.", "tabs": [{"t": "흐름", "items": [{"x": "모든 세력의 턴은 세 단계예요. 단계마다 할 일은 세력 보드에 적혀 있어요.", "sub": ["새벽(Birdsong): 준비 단계", "낮(Daylight): 주 행동 단계", "저녁(Evening): 정리, 카드 1장 이상 뽑기, 손 5장 넘으면 버리기"]}, {"x": "세력 한 줄 요약", "sub": ["고양이 후작: 숲 전체에 건물을 지어 점수. 행동 횟수가 많아요.", "독수리 왕조: 법령 카드를 매 턴 실행해야 하고, 못 하면 혼란에 빠져요.", "숲속 동맹: 동조 토큰을 퍼뜨리고 반란을 일으켜요. 공격당하면 분노 카드를 받아요.", "방랑자: 혼자 움직이며 퀘스트와 도움으로 점수. 아이템 관리가 핵심이에요."]}]}, {"t": "세팅", "items": [{"x": "세력마다 세팅 방법이 달라요. 세력 보드 뒷면을 따라 하세요."}, {"x": "각자 카드 3장으로 시작."}]}, {"t": "턴 체크", "items": [{"x": "저녁에 카드를 뽑았나? 가장 자주 빠뜨리는 단계예요."}, {"x": "지배자 판정: 그 칸에 전사와 건물 합이 가장 많은 쪽. 동점이면 아무도 아니지만, 독수리는 동점에서도 이겨요."}, {"x": "전투: 주사위 2개, 공격자가 높은 값, 방어자가 낮은 값. 방어자 전사가 없으면 1타 추가."}, {"x": "10점 이상이면 지배 카드를 쓸 수 있어요. 쓰면 점수 대신 지배 조건으로만 이겨요."}]}, {"t": "초보 실수", "items": [{"x": "남의 세력 규칙을 몰라서 견제를 못 함. 시작 전에 서로 세력을 한 번씩 설명하세요."}, {"x": "고양이 후작이 앞서가는 걸 늦게 알아챔."}, {"x": "독수리 법령을 너무 크게 키워서 혼란에 빠짐."}]}, {"t": "전략 팁", "items": [{"x": "1등을 다 같이 견제하는 게임이에요. 점수 트랙을 자주 보세요."}, {"x": "카드 손패는 이동, 건설, 제작에 다 쓰여요. 아끼세요."}]}]}, {"id": "pr", "name": "푸에르토리코 1897", "short": "푸에르토리코", "min": 3, "max": 5, "intro": "농장과 건물을 키워 작물을 생산하고, 팔거나 배에 실어 점수를 내요. 3–5인, 90–150분.", "tabs": [{"t": "흐름", "items": [{"x": "라운드마다 총독부터 돌아가며 역할 카드 1장을 골라요."}, {"x": "역할을 고르면 모두 그 행동을 하고, 고른 사람만 특권을 받아요.", "sub": ["개척자: 농장 타일 1개. 특권은 채석장", "시장: 노동자 받기. 특권은 1명 추가", "건축가: 건물 짓기. 특권은 1원 할인", "생산자: 작물 생산. 특권은 1개 추가", "상인: 작물 1개 팔기. 특권은 1원 추가", "선장: 배에 실어 점수. 특권은 1점 추가", "탐광자: 고른 사람만 1원"]}, {"x": "모두 고르면 라운드 끝. 안 뽑힌 역할에 1원씩 올리고, 총독이 왼쪽으로 넘어가요."}, {"x": "게임 끝: 셋 중 하나가 생기면 그 라운드를 마치고 끝나요.", "sub": ["모집 단계 끝에 일꾼 등록부를 다시 채울 일꾼이 모자랄 때", "누군가 건설 단계에서 섬 보드의 도시 칸을 다 채웠을 때", "선적 단계에서 마지막 승점 칩이 나갔을 때"]}]}, {"t": "세팅", "items": [{"x": "인원수에 따라 시작 돈, 노동자 수, 점수 칩, 배 크기가 달라요. 룰북 표를 따르세요."}, {"x": "시작 농장은 자리 순서에 따라 정해져요."}]}, {"t": "턴 체크", "items": [{"x": "건물과 농장은 노동자가 있어야 작동해요."}, {"x": "선장 단계에서 실을 수 있으면 반드시 실어야 해요. 배 한 척엔 한 종류만."}, {"x": "선장 단계가 끝나면 작물은 1개만 남기고 버려요. 창고가 있으면 더 보관."}, {"x": "상인 건물에는 같은 작물을 두 번 팔 수 없어요."}]}, {"t": "초보 실수", "items": [{"x": "선장 후 작물 버리기를 잊음."}, {"x": "노동자 없이 건물만 지어서 효과가 없음."}, {"x": "승점 칩이 다 떨어진 뒤 받은 점수를 안 적어둠. 종이에 적어서 끝에 더해야 해요."}, {"x": "대형 건물 보너스를 일꾼 없이 받으려 함. 기본 점수는 받지만, 보너스는 일꾼이 있어야 해요."}]}, {"t": "전략 팁", "items": [{"x": "돈 루트(비싼 작물 판매)와 선적 루트(싼 작물 대량 선적) 중 하나를 정하세요."}, {"x": "대형 건물은 끝 점수 보너스가 커요. 후반에 노리세요."}, {"x": "돈이 쌓인 역할은 손해 같아도 가져갈 가치가 있어요."}, {"x": "동점이면 남은 동전과 상품 통 개수를 합쳐서 가려요."}]}]}, {"id": "agricola", "name": "아그리콜라 패밀리 에디션", "short": "아그리콜라", "min": 1, "max": 4, "intro": "가족 일꾼을 보내 자원을 모으고, 밭을 갈고 동물을 키워 농장을 넓혀요. 수확 때마다 가족을 먹여야 해요. 1–4인, 14라운드, 45분 내외.", "tabs": [{"t": "흐름", "items": [{"x": "준비: 색 화살표가 있는 행동 칸에 표시된 만큼 자원을 채워요(이미 있어도 더 얹어요). 돼지는 6라운드, 소는 8라운드부터 채워요."}, {"x": "일하기: 수탉을 가진 사람부터 돌아가며 일꾼 1명씩 빈 행동 칸에 보내요. 한 칸엔 한 명만, 행동은 바로 해요."}, {"x": "귀가: 일꾼을 집으로 데려오고, 말을 한 칸 앞으로 옮겨 새 행동 칸을 열어요."}, {"x": "수확은 4, 7, 9, 11, 13, 14라운드 뒤에 와요.", "sub": ["밭: 밭마다 곡식을 딱 1개씩 가져와요", "먹이기: 한 명당 음식 2개. 그 라운드에 태어난 아기와 부모 둘이 한 칸에 서 있었으면 둘이 합쳐 3개", "번식: 종류별로 2마리 이상이면 딱 1마리 태어나요. 놓을 자리가 없으면 못 받아요"]}, {"x": "14라운드 마지막 수확 뒤 점수 계산."}]}, {"t": "세팅", "items": [{"x": "인원에 맞는 게임 보드 확장을 붙여요."}, {"x": "각자 나무 방 2칸짜리 집과 가족 2명으로 시작. 남은 사람은 공급처에 둬요."}, {"x": "시작 플레이어를 무작위로 정해요. 그 사람은 수탉과 음식 2개, 나머지는 음식 3개."}, {"x": "풍차, 바구니 공방, 도자기 공방, 목공소, 창고를 7, 9, 10, 11, 14번 칸 옆에, 나머지 설비는 보드 위에 둬요."}]}, {"t": "턴 체크", "items": [{"x": "다음 수확까지 음식이 충분한가? 모자라면 1개당 구걸 마커 1개(끝에 −3점)."}, {"x": "동물을 둘 자리가 있나? 목초지엔 한 종류만, 외양간 있는 목초지는 2배, 목초지 밖 외양간과 집엔 각각 1마리."}, {"x": "가족을 늘리려면 사람보다 방이 많아야 해요. 12라운드 칸만 방 없이 늘릴 수 있어요. 최대 5명."}]}, {"t": "초보 실수", "items": [{"x": "수확 직전에 음식이 모자람."}, {"x": "화덕이나 조리 화로 없이 동물을 음식으로 바꾸려 함. 설비가 없으면 못 바꿔요."}, {"x": "갓 태어난 가족을 그 라운드에 쓰려 함. 태어난 라운드엔 일을 못 해요."}, {"x": "나무 집에 진흙 방을 붙이려 함. 집은 한 재료로만 지어서 먼저 리노베이션(점토 3, 갈대 1)을 해야 해요."}, {"x": "밭에 있는 곡식을 쓰려 함. 수확 전엔 손댈 수 없어요."}]}, {"t": "전략 팁", "items": [{"x": "가족 늘리기는 빠를수록 좋아요. 행동 횟수가 곧 힘이에요. 한 명당 3점이기도 해요."}, {"x": "음식 엔진(화덕, 조리 화로, 흙 화덕)을 일찍 마련하면 수확이 편해요."}, {"x": "오리지널과 달리 \"없는 항목 감점\"이 없어서 잘하는 분야에 집중해도 괜찮아요. 구걸 마커만 피하세요."}, {"x": "창고 곡식과 자원은 점수가 없어요. 풍차, 바구니 공방, 도자기 공방, 목공소, 창고가 있을 때만 점수가 돼요."}, {"x": "동점이면 음식이 많은 사람이 이겨요."}]}]}, {"id": "tm", "name": "테라포밍 마스", "short": "테라포밍 마스", "min": 1, "max": 5, "intro": "기업을 맡아 화성의 바다, 온도, 산소를 올리면서 카드로 엔진을 키워요. 1–5인, 2시간 이상.", "tabs": [{"t": "흐름", "items": [{"x": "세대(라운드) 시작에 프로젝트 카드를 사요."}, {"x": "행동 단계: 돌아가며 1–2개 행동을 하고, 더 할 게 없으면 패스.", "sub": ["카드 내기, 표준 프로젝트, 마일스톤 달성(8 M€), 수상 후원", "식물 8개로 녹지, 열 8개로 온도 올리기", "파란 카드 행동(세대당 한 번)"]}, {"x": "생산 단계: 에너지는 열로 바뀌고, TR + M€ 생산만큼 돈을 받고, 나머지 자원을 생산해요."}, {"x": "바다, 온도, 산소가 모두 목표에 닿은 세대가 끝나면 게임 끝. 생산 단계 뒤에 플레이어 순서대로 식물을 녹지로 바꿀 기회가 한 번 더 있어요."}]}, {"t": "세팅", "items": [{"x": "기업 카드와 프로젝트 카드를 나눠주고, 남길 카드는 장당 3 M€를 내요."}, {"x": "마일스톤 5개, 수상 5개는 맵에 따라 정해져요."}]}, {"t": "턴 체크", "items": [{"x": "글로벌 수치를 올렸으면 TR도 1 올렸나?"}, {"x": "파란 카드 행동은 세대당 한 번만."}, {"x": "마일스톤은 게임 전체에서 3개까지만 달성돼요. 수상도 3개까지만 후원돼요."}]}, {"t": "초보 실수", "items": [{"x": "마지막 식물 → 녹지 전환을 잊음."}, {"x": "수상은 후원한 사람이 아니라 그 분야 1등이 5점을 받는다는 걸 모름."}, {"x": "도시 점수를 셀 때 남의 녹지는 안 셈. 주인과 상관없이 붙은 녹지는 다 세요."}, {"x": "2인 게임에서 수상 2등 점수를 줌. 2인엔 2등 점수가 없어요."}]}, {"t": "전략 팁", "items": [{"x": "초반엔 생산을 늘리고, 후반엔 점수 카드와 녹지로 바꾸세요."}, {"x": "마일스톤은 5점짜리라 조건이 되면 바로 달성하세요."}, {"x": "동점이면 남은 M€가 많은 사람이 이겨요."}]}]}, {"id": "pandemic", "name": "팬데믹", "short": "팬데믹", "min": 2, "max": 4, "intro": "전 세계에 퍼지는 질병 네 가지를 함께 막는 협력 게임이에요. 모두 같이 이기거나 같이 져요. 2–4인, 45분.", "tabs": [{"t": "흐름", "items": [{"x": "내 턴에 행동 4개: 이동, 질병 큐브 치료, 연구소 짓기, 카드 주고받기, 치료제 개발."}, {"x": "플레이어 카드 2장을 뽑아요. 전염 카드가 나오면 확산 처리를 해요."}, {"x": "감염률만큼 감염 카드를 뒤집어 도시에 큐브를 놓아요. 한 도시에 큐브가 4개째가 되면 대신 확산이 일어나요."}]}, {"t": "세팅", "items": [{"x": "난이도: 입문(전염 카드 4장, 손패 공개), 표준(5장), 영웅(6장). 표준과 영웅은 손패를 각자 가려요. 익숙하면 공개해도 돼요."}, {"x": "각자 역할 카드를 받아요. 역할 카드와 참고 카드는 손패 한도에 안 들어가요."}]}, {"t": "턴 체크", "items": [{"x": "행동 4개를 다 썼나?"}, {"x": "손패 한도를 넘었나? 넘으면 버려야 해요."}, {"x": "버린 카드 더미는 언제든 볼 수 있어요."}]}, {"t": "초보 실수", "items": [{"x": "질병을 박멸해야 이기는 줄 앎. 치료제 4개만 개발하면 바로 승리예요. 보드에 큐브가 남아 있어도 상관없어요."}, {"x": "플레이어 카드 덱이 떨어지는 것도 패배라는 걸 잊음. 행동 뒤 2장을 못 뽑으면 져요."}, {"x": "확산이 연쇄로 퍼지는 걸 놓침."}]}, {"t": "전략 팁", "items": [{"x": "패배 조건 세 가지(확산 트랙 끝, 큐브 부족, 카드 덱 소진)를 항상 같이 보세요."}, {"x": "역할 능력을 서로 설명하고 시작하세요. 역할 조합이 핵심이에요."}, {"x": "치료제가 급할 땐 카드를 한 사람에게 몰아주세요."}]}]}, {"id": "azul", "name": "아줄 듀얼", "short": "아줄 듀얼", "min": 2, "max": 2, "intro": "궁전 천장 돔을 타일로 꾸미는 2인 전용 아줄이에요. 5라운드로 끝나요. 2인, 30–45분.", "tabs": [{"t": "흐름", "items": [{"x": "획득: 돔 플레이트와 공장의 타일을 가져와요. 작은 공장엔 보너스 칩이 함께 있어요."}, {"x": "돔 타일링과 점수: 가져온 타일로 돔을 채우고 점수 트랙을 올려요. 넘친 타일은 깨진 타일 칸으로 가요."}, {"x": "준비(5라운드엔 건너뛰어요): 점수 보드에서 내 플레이어 토큰 2개를 회수하고, 돔 플레이트를 3장으로, 큰 공장 function openGuides(){
  const box=$("#glist"); box.innerHTML="";
  ALL.forEach(g=>{ const b=el("button","gcard",`<b><i class="sw" style="background:${THEME[g.id]}"></i>${esc(g.short)}</b><small>${g.min===g.max?g.min+"인 전용":g.min+"–"+g.max+"인"}</small>`); b.onclick=()=>{ SFX.tap(); openGuide(g.id); }; box.appendChild(b); });
  show("guides");
}
function openGuide(id, tab){
  gCur = gById(id); gTab = tab||0;
  $("#gTitle").textContent = gCur.short; applyTheme(gCur.id); $("#gIntro").textContent = gCur.intro;
  const tabs=$("#gTabs"); tabs.innerHTML="";
  gCur.tabs.forEach((t,i)=>{ const b=el("button","",esc(t.t)); b.setAttribute("role","tab"); b.onclick=()=>{ SFX.tap(); setTab(i); }; tabs.appendChild(b); });
  const foot=$("#gFoot"); foot.innerHTML="";
  if(gameDef(id)){ const s=el("button","ghost","이 게임 점수판 열기"); s.onclick=()=>{ SFX.tap(); pickedGame=id; openPlayers(); }; foot.appendChild(s); }
  setTab(gTab); show("guide");
}
function setTab(i){
  gTab=i; const t=gCur.tabs[i];
  document.querySelectorAll("#gTabs button").forEach((b,j)=>{ b.classList.toggle("on",j===i); b.setAttribute("aria-selected",j===i); if(j===i) b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); });
  const tag = t.t==="흐름"?"ol":"ul";
  $("#gBody").innerHTML = `<${tag}>${t.items.map(it=>`<li>${esc(it.x)}${it.sub?`<ul>${it.sub.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}</li>`).join("")}</${tag}>`;
  $("#gBody").scrollTop=0;
}
let gsx=null,gsy=null; $("#gBody").addEventListener("touchstart",e=>{gsx=e.touches[0].clientX;gsy=e.touches[0].clientY},{passive:true});
$("#gBody").addEventListener("touchend",e=>{ if(gsx==null) return; const dx=e.changedTouches[0].clientX-gsx, dy=e.changedTouches[0].clientY-gsy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5){ const n=gTab+(dx<0?1:-1); if(n>=0&&n<gCur.tabs.length){ SFX.tap(); setTab(n);} } gsx=null; });

/* ---------- first player ---------- */
let firstSel = LS.get("homi.firstSel", null);
let firstBusy = false;
function openFirst(){
  if(!Array.isArray(firstSel)) firstSel = (chosen.length?chosen:names.slice(0,Math.min(4,names.length)));
  firstSel = firstSel.filter(n=>names.includes(n));
  $("#firstQuick").checked = LS.get("homi.firstQuick", false);
  $("#verdict").textContent=""; renderFirst(); show("first");
}
function renderFirst(){
  const chips=$("#firstChips"); chips.innerHTML="";
  names.forEach(n=>{ const on=firstSel.includes(n); const c=el("button","chip"+(on?" on":""),`${meeple(on?COLORS[firstSel.indexOf(n)%5]:"var(--line)")}${esc(n)}`);
    c.onclick=()=>{ if(firstBusy) return; SFX.tap(); firstSel = on? firstSel.filter(x=>x!==n) : firstSel.concat(n); LS.set("homi.firstSel",firstSel); $("#verdict").textContent=""; renderFirst(); }; chips.appendChild(c); });
  const ring=$("#ring"); ring.className="ring n"+Math.min(firstSel.length,5); ring.innerHTML="";
  if(firstSel.length<2){ ring.className="empty"; ring.innerHTML=`<div><img class="emptyart" src="${IMG.sleep}" alt=""><p>위에서 2명 이상 골라주세요</p></div>`; }
  else firstSel.forEach((n,i)=>{ const s=el("div","slot",`${meeple(COLORS[i%5])}<b>${esc(n)}</b>`); ring.appendChild(s); });
  $("#firstGo").disabled = firstSel.length<2 || firstBusy;
}
function spinFirst(power){
  if(firstBusy || firstSel.length<2) return;
  const slots=[...document.querySelectorAll("#ring .slot")], n=slots.length, target=rand(n);
  slots.forEach(s=>s.classList.remove("win","lose","hot")); $("#verdict").textContent="";
  const finish=()=>{ slots.forEach((s,i)=>{ s.classList.remove("hot"); s.classList.add(i===target?"win":"lose"); });
    $("#firstHero").classList.remove("pounce"); void $("#firstHero").offsetWidth; $("#firstHero").classList.add("pounce");
    $("#verdict").textContent = `${firstSel[target]} 먼저!`; SFX.fanfare(); firstBusy=false; renderFirstBtn(); };
  if($("#firstQuick").checked){ finish(); return; }
  firstBusy=true; renderFirstBtn();
  const loops = Math.max(2, Math.min(6, Math.round(power||3)));
  const total = loops*n + target + 1; let i=0;
  const step=()=>{ slots.forEach(s=>s.classList.remove("hot")); slots[i%n].classList.add("hot"); tone(1400+((i%n)*60),0.03,"square",0.05);
    i++; if(i>=total){ setTimeout(finish,280); return; }
    const p=i/total; setTimeout(step, 45 + 520*Math.pow(p,3)); };
  step();
}
function renderFirstBtn(){ $("#firstGo").disabled = firstSel.length<2 || firstBusy; $("#firstGo").textContent = firstBusy?"고르는 중…":"돌리기"; }
$("#firstGo").onclick=()=>spinFirst(3);
$("#firstQuick").onchange=e=>LS.set("homi.firstQuick", e.target.checked);
(function(){ let sy=null,st=0; const r=$("#ring");
  r.addEventListener("touchstart",e=>{ sy=e.touches[0].clientX; st=performance.now(); },{passive:true});
  r.addEventListener("touchend",e=>{ if(sy==null) return; const dx=Math.abs(e.changedTouches[0].clientX-sy), dt=performance.now()-st; sy=null;
    if(dx>50){ const v=dx/Math.max(dt,1); spinFirst(2+v*3); } });
})();

/* ---------- wheel ---------- */
let wCount = LS.get("homi.wCount", 4), wAngle = 0, wBusy = false, wList = [];
function openWheel(){
  const c=$("#counts"); c.querySelectorAll("button").forEach(b=>b.remove());
  for(let k=1;k<=5;k++){ const b=el("button",k===wCount?"on":"",String(k)); b.setAttribute("aria-label",k+"명"); b.onclick=()=>{ if(wBusy) return; wCount=k; LS.set("homi.wCount",k); SFX.tap(); openWheel(); }; c.appendChild(b); }
  $("#wheelQuick").checked = LS.get("homi.wQuick", false);
  drawWheel(); $("#wheelResult").innerHTML=`<p class="soft">${wList.length}개 게임 중에서 골라요. 돌림판을 쓸어서 돌려도 돼요.</p>`;
  show("wheel");
}
function drawWheel(){
  wList = ALL.filter(g=>wCount>=g.min && wCount<=g.max);
  const svg=$("#wheelSvg"), n=wList.length, R=104, cols=["#C8843F","#E2A93B","#B9773A","#D99A5A","#A8672F","#EBC27A"];
  let h=`<g id="wheelRot" style="transform:rotate(${wAngle}deg);transform-origin:0 0">`;
  if(n===0){ svg.innerHTML=`<circle r="${R}" fill="#E8D2A6"/><image href="${IMG.sleep}" x="-70" y="-70" width="140" height="140"/>`; $("#wheelResult").innerHTML='<p class="soft">이 인원으로 할 수 있는 게임이 없어요</p>'; return; }
  wList.forEach((g,i)=>{ const a0=(i/n)*2*Math.PI-Math.PI/2, a1=((i+1)/n)*2*Math.PI-Math.PI/2;
    const x0=R*Math.cos(a0),y0=R*Math.sin(a0),x1=R*Math.cos(a1),y1=R*Math.sin(a1), large=(a1-a0)>Math.PI?1:0;
    const fill = n===1?cols[0]:cols[i%(n%2===1&&i===n-1?5:6)];
    h+=`<path d="M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${fill}" stroke="#7A4A22" stroke-width="1"/>`;
    const am=((i+.5)/n)*360-90, fs = n>14?8.2:n>9?9.5:11.5;
    h+=`<text transform="rotate(${am.toFixed(2)}) translate(${R-8} 0)" text-anchor="end" dominant-baseline="middle" font-family="Jua, sans-serif" font-size="${fs}" fill="#FFF6E4" stroke="rgba(70,35,10,.45)" stroke-width=".6" paint-order="stroke">${esc(g.short)}</text>`;
  });
  h+=`<circle r="${R}" fill="none" stroke="#6E4019" stroke-width="5"/>`;
  for(let i=0;i<n;i++){ const a=(i/n)*2*Math.PI-Math.PI/2; h+=`<circle cx="${(R*Math.cos(a)).toFixed(2)}" cy="${(R*Math.sin(a)).toFixed(2)}" r="2.2" fill="#F6D9A2"/>`; }
  h+=`</g>`; svg.innerHTML=h;
}
function setWheel(a){ wAngle=a; const g=document.getElementById("wheelRot"); if(g) g.style.transform=`rotate(${a}deg)`; }
function spinWheel(power){
  if(wBusy || !wList.length) return;
  const n=wList.length, target=rand(n), seg=360/n;
  const centerOf = (target+.5)*seg; // degrees from top, clockwise
  const jitter = (Math.random()-.5)*seg*0.6;
  const base = ((360 - centerOf - jitter) % 360 + 360) % 360;
  const cur = ((wAngle%360)+360)%360;
  const loops = Math.max(3, Math.min(9, Math.round(power||5)));
  const end = wAngle + loops*360 + ((base - cur + 360)%360);
  const done=()=>{ wBusy=false; $("#wheelGo").disabled=false; $("#wheelGo").textContent="다시 돌리기"; showWheelResult(wList[target]); };
  $("#wheelResult").innerHTML="";
  if($("#wheelQuick").checked){ setWheel(end); done(); return; }
  wBusy=true; $("#wheelGo").disabled=true; $("#wheelGo").textContent="도는 중…";
  const start=wAngle, dur=3600+loops*260, t0=performance.now(); let lastSeg=Math.floor(start/seg);
  const ease=t=>1-Math.pow(1-t,4);
  const frame=now=>{ const t=Math.min(1,(now-t0)/dur), a=start+(end-start)*ease(t); setWheel(a);
    const s=Math.floor(a/seg); if(s!==lastSeg){ lastSeg=s; tone(1700,0.025,"square",0.045); }
    if(t<1) requestAnimationFrame(frame); else done(); };
  requestAnimationFrame(frame);
}
function showWheelResult(g){
  SFX.fanfare();
  const r=$("#wheelResult"); r.innerHTML=`<h3>오늘은 ${esc(g.short)}!</h3>`;
  const a=el("button","ghost","가이드 보기"); a.onclick=()=>{ SFX.tap(); openGuide(g.id); }; r.appendChild(a);
  if(gameDef(g.id)){ const b=el("button","ghost","점수판 열기"); b.onclick=()=>{ SFX.tap(); pickedGame=g.id; openPlayers(); }; r.appendChild(b); }
}
$("#wheelGo").onclick=()=>spinWheel(5);
$("#wheelQuick").onchange=e=>LS.set("homi.wQuick", e.target.checked);
(function(){ const box=$("#wheelBox"); let pts=[];
  const ang=(e)=>{ const r=box.querySelector(".wheelwrap").getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return Math.atan2(p.clientY-(r.top+r.height/2), p.clientX-(r.left+r.width/2))*180/Math.PI; };
  let a0=null, w0=0;
  const down=e=>{ if(wBusy||!wList.length) return; a0=ang(e); w0=wAngle; pts=[{t:performance.now(),a:w0}]; };
  const move=e=>{ if(a0==null) return; let d=ang(e)-a0; if(d>180)d-=360; if(d<-180)d+=360; setWheel(w0+d); pts.push({t:performance.now(),a:w0+d}); if(pts.length>6) pts.shift(); if(e.cancelable) e.preventDefault(); };
  const up=()=>{ if(a0==null) return; a0=null; const p0=pts[0], p1=pts[pts.length-1]; const v=p1&&p0&&p1.t>p0.t ? (p1.a-p0.a)/(p1.t-p0.t) : 0;
    if(Math.abs(v)>0.25) spinWheel(3+Math.abs(v)*2.2); };
  box.addEventListener("touchstart",down,{passive:true}); box.addEventListener("touchmove",move,{passive:false}); box.addEventListener("touchend",up);
  box.addEventListener("mousedown",down); window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
})();

/* ---------- home minis ---------- */
document.querySelectorAll(".mini").forEach(b=>b.onclick=()=>{ SFX.tap(); const go=b.dataset.go; if(go==="guide") openGuides(); else if(go==="wheel") openWheel(); else if(go==="first") openFirst(); });

/* ---------- sheet ---------- */
function openSheet(html, bind){ const m=$("#modal"), s=$("#sheet"); s.innerHTML=html; m.classList.add("on"); if(bind) bind(s); }
function closeSheet(){ $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeSheet(); });

})();
</script>
